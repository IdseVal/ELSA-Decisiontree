# The first Tree: does the EU AI Act apply to an agrifood AI system, and how far?
# Authored from docs/research/issue-3-ai-act-applicability.md (issue #3), which quotes the
# consolidated text of 27 July 2026 (CELEX 02024R1689-20260727). The Dutch text uses the
# official terminology of the Dutch-language consolidated text. Version 0.2: the same
# content, re-cut to the length limits of elsa-tree/2 (issue #44); see NOTES.md.
format: elsa-tree/3
languages: [en, nl]
root: start
title:
  en: Does the EU AI Act apply to my agrifood AI system?
  nl: Is de EU AI-verordening van toepassing op mijn agrifood-AI-systeem?
description:
  en: |
    An interactive walk through the applicability of Regulation (EU) 2024/1689 (the AI
    Act) to an AI system in the agrifood domain, in six steps: does the Act reach you,
    is your system an AI system, is it a prohibited practice, is it high-risk, is it
    general-purpose AI, and does it carry transparency obligations.

    The walk stops after the transparency step. It is written from the consolidated text
    of 27 July 2026, which integrates Regulation (EU) 2026/1744.
  nl: |
    Een interactieve doorloop van de toepasselijkheid van Verordening (EU) 2024/1689 (de
    AI-verordening) op een AI-systeem in het agrifood-domein, in zes stappen: bereikt de
    verordening u, is uw systeem een AI-systeem, gaat het om een verboden praktijk, om
    een hoog risico, om AI voor algemene doeleinden, en gelden er
    transparantieverplichtingen?

    De doorloop stopt na de transparantiestap. Basis is de geconsolideerde tekst van 27
    juli 2026, met Verordening (EU) 2026/1744.
metadata:
  version: "0.2"
  author: prepared by the ELSA-Decisiontree agents for the owner's review
  status: draft, not legally reviewed
  legal-text: consolidated AI Act of 27 July 2026, CELEX 02024R1689-20260727
  amended-by: Regulation (EU) 2026/1744 (Digital Omnibus on AI)
  research: docs/research/issue-3-ai-act-applicability.md

# The look of the ELSA-Lab for sustainable food systems, https://ai4sfs.org, as issue #36
# measured it (docs/research/issue-36-ai4sfs-visual-identity.md, section 7). Every file
# named here is in theme/, downloaded from that site and checked against the SHA-256 the
# research recorded; theme/LICENCE.md states the terms of each one.
theme:
  logo:
    # The desktop header logo. It has an opaque white background baked into the pixels
    # (research 2.2), which is why `background` below is white and why there is no `dark`
    # variant: the lab publishes no transparent or vector master (research 2.4).
    light: elsa-lab-logo.png
    icon: favicon.png
    alt:
      en: ELSA-Lab for sustainable food systems
      nl: ELSA-Lab voor duurzame voedselsystemen
    url: https://ai4sfs.org
  fonts:
    # Open Sans in both roles, which is what the site itself uses: research 3.1 found
    # Nova Square on one oversized display heading the frontend does not have. Only the
    # latin subset ships -- English and Dutch are all below U+0100 (theme/LICENCE.md).
    - family: Open Sans
      role: body
      files:
        - { file: open-sans-400.woff2, weight: "400", style: normal }
        - { file: open-sans-600.woff2, weight: "600", style: normal }
      licence: SIL Open Font License 1.1 (theme/ofl-open-sans.txt)
    - family: Open Sans
      role: heading
      files:
        - { file: open-sans-700.woff2, weight: "700", style: normal }
      licence: SIL Open Font License 1.1 (theme/ofl-open-sans.txt)
  # The seven roles of tree-format.md 4.3.3, filled from research 7's role -> value table --
  # except text-muted. The site's .uk-text-muted #a3a4a8 is 2.49 : 1 on background and
  # 2.24 : 1 on surface, and the frontend draws the credits, the disclaimer and
  # the Source kinds in it, all at 11 to 13 pixels, where WCAG 2.2 SC 1.4.3 asks 4.5 : 1
  # (issue #64). #696a6e is the same cool grey darkened to 5.40 : 1 on background and
  # 4.85 : 1 on surface, and stays lighter than text (2.51 : 1 against it).
  # accent-secondary is the walk's controls -- the Answer buttons, the up arrow, startAgain
  # -- and the owner asked for them in the green of the ELSA logo's lettering (issue #75),
  # measured by issue #36 as #159a2f, not the site's interface green #41ab64. White on it
  # is 3.69 : 1, enough for the 19-pixel bold label, which is large text (ADR-78).
  colours:
    background: "#ffffff"        # html { background:#fff }
    surface: "#f0f3f7"           # .uk-button-default, .uk-progress
    text: "#2d2e33"              # html { color:#2d2e33 }
    text-muted: "#696a6e"        # .uk-text-muted #a3a4a8, darkened to read (issue #64)
    accent: "#ffc600"            # the navbar and primary button yellow
    accent-secondary: "#159a2f"  # the ELSA logo's lettering (issue #36 4.2)
    danger: "#e44e56"            # .uk-button-danger, .uk-text-danger

--- # start
id: start
title:
  en: Jurisdictional scope of the AI Act? (1/7)
  nl: Toepassingsgebied van de AI-verordening? (1/7)
description:
  en: |
    Are you a [provider](#provider) who places an AI system on the Union market or puts it into service in the Union, or who places a general-purpose AI model on the…
  nl: |
    Bent u een [aanbieder](#provider) die een AI-systeem in de Unie in de handel brengt of in gebruik stelt, of een AI-model voor algemene doeleinden in de Unie in de…
metadata:
  version: "0.2"
  step: 1 - jurisdictional scope
sources:
  - id: art-2-1
    kind: legal
    label:
      en: Article 2(1) AI Act (scope)
      nl: Artikel 2, lid 1, AI-verordening (toepassingsgebied)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2
  - kind: legal
    label:
      en: Article 3(3), (9), (11) AI Act (definitions)
      nl: Artikel 3, punten 3, 9 en 11, AI-verordening (definities)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_3
images:
  - file: step-jurisdiction.jpg
    description:
      en: "Map of the European Union member states, whose market Article 2(1) reaches"
      nl: "Kaart van de lidstaten van de Europese Unie, die artikel 2, lid 1, bereikt"
    credit: "Ssolbergj and Moonraker, via Wikimedia Commons, CC BY-SA 4.0"
    source: art-2-1
explainers:
  - id: provider
    term:
      en: provider
      nl: aanbieder
    text:
      en: A person, organisation or public body that develops an AI system or general-purpose AI model, or has one developed, and places it on the market or puts it into service under its own name or trademark.
      nl: Een persoon, organisatie of overheidsorgaan die een AI-systeem of AI-model voor algemene doeleinden ontwikkelt of laat ontwikkelen en onder eigen naam of merk in de handel brengt of in gebruik stelt.
answers:
  yes: article-2-exclusions
  no: jurisdiction-deployer

--- # ai-act-does-not-apply
id: ai-act-does-not-apply
title:
  en: The AI Act does not apply
  nl: De AI-verordening is niet van toepassing
description:
  en: |
    None of the seven categories of Article 2(1) describes you, or an Article 2 exclusion covers your system entirely.
  nl: |
    Geen van de zeven categorieën van artikel 2, lid 1, is op u van toepassing, of een uitsluiting van artikel 2 geldt volledig voor uw systeem.
