--- # exclusion-national-security
id: exclusion-national-security
title:
  en: Military, defence or national security purposes
  nl: Militaire, defensie- of nationale veiligheidsdoeleinden
description:
  en: |
    Article 2(3) excludes three things: areas outside the scope of Union law and the
    Member States' competences concerning **national security**; AI systems placed on
    the market, put into service or used **exclusively** for military, defence or
    national security purposes; and systems whose output is used in the Union
    exclusively for those purposes.

    Recital 24: a system placed on the market for a non-excluded purpose as well falls
    within the Regulation.
  nl: |
    Artikel 2, lid 3, sluit drie dingen uit: gebieden buiten het Unierecht en de
    bevoegdheden van de lidstaten inzake **nationale veiligheid**; AI-systemen die
    **uitsluitend** voor militaire, defensie- of nationale veiligheidsdoeleinden in de
    handel worden gebracht, in gebruik gesteld of gebruikt; en systemen waarvan de output
    in de Unie uitsluitend daarvoor wordt gebruikt.

    Overweging 24: een systeem dat ook een niet-uitgesloten doel dient, valt binnen de
    verordening.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(3) AI Act
      nl: Artikel 2, lid 3, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exclusion-open-source
id: exclusion-open-source
title:
  en: Free and open-source licences (partial exclusion only)
  nl: Vrije en opensourcelicenties (slechts gedeeltelijk)
description:
  en: |
    Article 2(12): the Regulation does not apply to AI systems released under free and
    open-source licences, **unless** they are placed on the market or put into service
    as high-risk AI systems or as a system that falls under Article 5 or Article 50.

    This is not a full exclusion, so answer **no** on the exclusions step: it does not
    end the walk. Steps 3, 4 and 6 ask exactly the questions the exception names; an
    open-source system must still go through them.
  nl: |
    Artikel 2, lid 12: de verordening is niet van toepassing op AI-systemen die worden
    vrijgegeven onder vrije en opensourcelicenties, **tenzij** zij in de handel worden
    gebracht of in gebruik worden gesteld als systeem met een hoog risico of als systeem
    dat onder artikel 5 of artikel 50 valt.

    Dit is geen volledige uitsluiting: antwoord bij de uitsluitingen dus **nee**, want de
    doorloop eindigt hier niet. De stappen 3, 4 en 6 stellen precies de vragen die de
    uitzondering noemt.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(12) AI Act
      nl: Artikel 2, lid 12, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exclusion-personal-use
id: exclusion-personal-use
title:
  en: A natural person using a system in a personal activity
  nl: Natuurlijke persoon in een persoonlijke activiteit
description:
  en: |
    Article 2(10) excludes the **obligations of deployers who are natural persons**
    using AI systems in the course of a purely personal non-professional activity.

    Two limits: it excludes obligations of *deployers*, not those of the provider of the
    system they use; and the activity must be purely personal. Anything done in the
    course of a farm business, a cooperative or a research institute is not.
  nl: |
    Artikel 2, lid 10, sluit de **verplichtingen uit van gebruiksverantwoordelijken die
    natuurlijke personen zijn** en AI-systemen gebruiken in het kader van een louter
    persoonlijke niet-beroepsactiviteit.

    Twee grenzen: het sluit verplichtingen van *gebruiksverantwoordelijken* uit, niet die
    van de aanbieder; en de activiteit moet louter persoonlijk zijn. Werk in een
    landbouwbedrijf, een coöperatie of een onderzoeksinstituut is dat niet.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(10) AI Act
      nl: Artikel 2, lid 10, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exclusion-research-and-development
id: exclusion-research-and-development
title:
  en: Research or testing before placing on the market
  nl: Onderzoek of tests vóór het in de handel brengen
description:
  en: |
    Article 2(8) excludes **any research, testing or development activity** regarding AI
    systems or AI models **prior to their being placed on the market or put into
    service**. Such activities must still be conducted in accordance with applicable
    Union law.

    The exclusion covers the *activity*, not the system, and **testing in real world
    conditions is expressly not covered**. Field trials on a working farm therefore stay
    inside the Act.
  nl: |
    Artikel 2, lid 8, sluit **onderzoeks-, test- of ontwikkelingsactiviteiten** uit met
    betrekking tot AI-systemen of AI-modellen **voordat zij in de handel worden gebracht
    of in gebruik worden gesteld**. Die activiteiten moeten wel in overeenstemming met
    het toepasselijke Unierecht worden uitgevoerd.

    De uitsluiting betreft de *activiteit*, niet het systeem, en **testen onder reële
    omstandigheden valt er uitdrukkelijk niet onder**. Praktijkproeven op een werkend
    bedrijf blijven dus binnen de verordening.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(8) AI Act
      nl: Artikel 2, lid 8, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exclusion-scientific-research
id: exclusion-scientific-research
title:
  en: Sole purpose of scientific research and development
  nl: Uitsluitend wetenschappelijk onderzoek en ontwikkeling
description:
  en: |
    Article 2(6) excludes AI systems and AI models, including their output, that are
    **specifically developed and put into service for the sole purpose of scientific
    research and development**.

    This excludes the *system*, not merely an activity. Recital 25 adds that any other
    system that may be used for research and development remains subject to the
    Regulation, so a system built for another purpose and used in research is not
    excluded.
  nl: |
    Artikel 2, lid 6, sluit AI-systemen en AI-modellen uit, met inbegrip van hun output,
    die **specifiek zijn ontwikkeld en in gebruik gesteld met wetenschappelijk onderzoek
    en wetenschappelijke ontwikkeling als enig doel**.

    Dit sluit het *systeem* zelf uit, niet slechts een activiteit. Overweging 25 voegt
    toe dat elk ander systeem dat voor onderzoek kan worden gebruikt, aan de verordening
    onderworpen blijft.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(6) AI Act
      nl: Artikel 2, lid 6, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exclusion-third-country-authorities
id: exclusion-third-country-authorities
title:
  en: Third-country authorities in law enforcement cooperation
  nl: Autoriteiten van derde landen bij rechtshandhaving
description:
  en: |
    Article 2(4) excludes third-country public authorities and international
    organisations that would otherwise fall under Article 2(1), **where they use AI
    systems in the framework of international cooperation or agreements for law
    enforcement and judicial cooperation** with the Union or its Member States.

    It is conditional: the country or organisation must provide adequate safeguards for
    the fundamental rights and freedoms of individuals.
  nl: |
    Artikel 2, lid 4, sluit overheidsinstanties in derde landen en internationale
    organisaties uit die anders onder artikel 2, lid 1, zouden vallen, **wanneer zij
    AI-systemen gebruiken in het kader van internationale samenwerking of overeenkomsten
    met de Unie of de lidstaten op het gebied van rechtshandhaving en justitie**.

    De uitsluiting is voorwaardelijk: het derde land of de organisatie moet passende
    waarborgen voor de grondrechten bieden.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2(4) AI Act
      nl: Artikel 2, lid 4, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2

--- # exploiting-vulnerabilities
id: exploiting-vulnerabilities
title:
  en: Exploiting vulnerabilities of age, disability or situation
  nl: Misbruik van kwetsbaarheden (leeftijd, handicap, situatie)
description:
  en: |
    Article 5(1)(b) prohibits placing on the market, putting into service or using an AI
    system that **exploits the vulnerabilities** of a person or a specific group **due
    to their age, disability, or a specific social or economic situation**, with the
    objective or the effect of materially distorting their behaviour in a manner that
    causes or is reasonably likely to cause significant harm. Unlike point (a) the lever
    is a listed vulnerability, the grounds are closed, and no impairment of informed
    decision-making is required.
  nl: |
    Artikel 5, lid 1, punt b), verbiedt het in de handel brengen, in gebruik stellen of
    gebruiken van een AI-systeem dat **gebruikmaakt van de kwetsbaarheden** van een
    persoon of groep **als gevolg van leeftijd, handicap of een specifieke sociale of
    economische omstandigheid**, met als doel of gevolg het gedrag wezenlijk te verstoren
    op een wijze die aanzienlijke schade veroorzaakt of waarschijnlijk veroorzaakt.
    Anders dan bij punt a) is de grond limitatief en hoeft het besluitvermogen niet
    belemmerd te zijn.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 5(1)(b) AI Act
      nl: Artikel 5, lid 1, punt b), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # general-purpose-ai
id: general-purpose-ai
title:
  en: Is general-purpose AI involved?
  nl: Is er sprake van AI voor algemene doeleinden?
description:
  en: |
    The Act uses two terms. A **general-purpose AI model** (Article 3(63)) displays
    significant generality, performs a wide range of distinct tasks competently and can
    be integrated into many downstream systems; a **general-purpose AI system** (Article
    3(66)) is based on such a model and can serve a variety of purposes. Chapter V places
    its obligations on **providers of models** (Articles 53 and 55; Article 51 classifies
    models with **systemic risk**), not on such a system as such. Either answer continues.
  nl: |
    De verordening gebruikt twee begrippen. Een **AI-model voor algemene doeleinden**
    (artikel 3, punt 63) vertoont een aanzienlijk algemeen karakter, voert een breed scala
    aan taken competent uit en kan in veel systemen worden geïntegreerd; een **AI-systeem
    voor algemene doeleinden** (artikel 3, punt 66) is op zo'n model gebaseerd en kan
    verschillende doeleinden dienen. Hoofdstuk V legt verplichtingen op aan **aanbieders
    van modellen** (artikelen 53 en 55; artikel 51 gaat over **systeemrisico**), niet aan
    zo'n systeem als zodanig. Beide antwoorden lopen door.
metadata:
  version: "0.2"
  step: 5 - general-purpose AI
  placeholder: true
  owner-action: |
    Placeholder for the owner to refine (core document 3.3, items 5 and 7). The research
    shows this step is really two questions with different consequences - "do you provide a
    general-purpose AI model?" (Chapter V obligations) and "is your system based on such a
    model?" (relevant to Article 50(2) and to the downstream-provider definition) - which one
    yes/no cannot separate. Splitting it into two Nodes, or adding a role question, is an
    authoring decision the owner should make after seeing the tool.
