--- # predicting-criminal-offences
id: predicting-criminal-offences
title:
  en: Predicting criminal offences from profiling or personality traits alone
  nl: Het voorspellen van strafbare feiten uitsluitend op basis van profilering of persoonlijkheidskenmerken
description:
  en: |
    Article 5(1)(d) prohibits placing on the market, putting into service for this specific
    purpose, or using an AI system for **making risk assessments of natural persons in
    order to assess or predict the risk of a natural person committing a criminal
    offence**, based **solely** on the profiling of a natural person or on assessing their
    personality traits and characteristics.

    The text carves out one case: the prohibition **does not apply** to AI systems used to
    **support the human assessment** of the involvement of a person in a criminal activity
    where that assessment is **already based on objective and verifiable facts directly
    linked to a criminal activity**.

    The word "solely" is doing the work. A system that draws on objective, verifiable facts
    tied to an actual criminal activity, and supports rather than replaces a human
    assessment, is outside this point.

    This is an explanation only. Go back to the previous step to answer.
  nl: |
    Artikel 5, lid 1, punt d), verbiedt het in de handel brengen, het voor dit specifieke
    doel in gebruik stellen of het gebruiken van een AI-systeem **voor risicobeoordelingen
    van natuurlijke personen om het risico dat een natuurlijke persoon een strafbaar feit
    pleegt te beoordelen of te voorspellen**, **uitsluitend** op basis van de profilering
    van een natuurlijke persoon of op basis van de beoordeling van diens
    persoonlijkheidseigenschappen en -kenmerken.

    De tekst maakt één uitzondering: het verbod **geldt niet** voor AI-systemen die worden
    gebruikt **ter ondersteuning van de menselijke beoordeling** van de betrokkenheid van
    een persoon bij een criminele activiteit, die **reeds op rechtstreeks met de criminele
    activiteit verband houdende objectieve en verifieerbare feiten is gebaseerd**.

    Het woord "uitsluitend" is hier doorslaggevend. Een systeem dat put uit objectieve,
    verifieerbare feiten die verband houden met een werkelijke criminele activiteit, en dat
    een menselijke beoordeling ondersteunt in plaats van vervangt, valt buiten dit punt.

    Dit is alleen uitleg. Ga terug naar de vorige stap om te antwoorden.
metadata:
  version: "0.1"
sources:
  - kind: legal
    label:
      en: Article 5(1)(d) AI Act
      nl: Artikel 5, lid 1, punt d), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # prohibited-practices
id: prohibited-practices
title:
  en: Does your system do any of the prohibited practices?
  nl: Verricht uw systeem een van de verboden praktijken?
description:
  en: |
    Article 5(1) lists AI practices that are **prohibited** outright. There is no
    compliance route for them: a system that does one of these may not be placed on the
    market, put into service or used at all.

    The list below has **ten** entries. Points (ba) and (bb) were inserted by Regulation
    (EU) 2026/1744 and apply from **2 December 2026**; the other eight have applied since
    2 February 2025.

    Open each entry to read what it covers and which conditions the text attaches, then
    come back here and answer. Most points cover placing on the market, putting into
    service *and* use, so they can catch you whether you build the system or only use it.
    Point (h) is different: it covers only the use, and only by law enforcement.

    Article 5(8) adds that this Article does not affect prohibitions that apply where an
    AI practice infringes other Union law.

    Answer **yes** if any entry describes your system, **no** if none of them does.
  nl: |
    Artikel 5, lid 1, noemt AI-praktijken die zonder meer **verboden** zijn. Er is voor
    deze praktijken geen route naar naleving: een systeem dat een daarvan verricht, mag
    helemaal niet in de handel worden gebracht, in gebruik worden gesteld of worden
    gebruikt.

    De lijst hieronder bevat **tien** onderdelen. De punten b bis) en b ter) zijn ingevoegd
    bij Verordening (EU) 2026/1744 en gelden vanaf **2 december 2026**; de andere acht
    gelden sinds 2 februari 2025.

    Open elk onderdeel om te lezen wat het inhoudt en welke voorwaarden de tekst eraan
    verbindt, en kom daarna hier terug om te antwoorden. De meeste punten bestrijken het in
    de handel brengen, het in gebruik stellen *en* het gebruiken, en kunnen u dus raken of
    u het systeem nu bouwt of alleen gebruikt. Punt h) is anders: dat bestrijkt alleen het
    gebruik, en alleen met het oog op de rechtshandhaving.

    Artikel 5, lid 8, voegt daaraan toe dat dit artikel geen afbreuk doet aan de
    verbodsbepalingen die van toepassing zijn wanneer een AI-praktijk een inbreuk vormt op
    het Unierecht.

    Antwoord **ja** als een van de onderdelen op uw systeem van toepassing is, **nee** als
    geen ervan dat is.
