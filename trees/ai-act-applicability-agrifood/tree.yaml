    label:
      en: Article 5(1)(c) AI Act
      nl: Artikel 5, lid 1, punt c), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # subliminal-or-manipulative-techniques
id: subliminal-or-manipulative-techniques
title:
  en: Subliminal or purposefully manipulative techniques
  nl: Subliminale of doelbewust manipulatieve technieken
description:
  en: |
    Article 5(1)(a) prohibits placing on the market, putting into service or using an AI
    system that deploys **subliminal techniques beyond a person's consciousness**, or
    **purposefully manipulative or deceptive techniques**, with the objective or the
    effect of materially distorting behaviour. Every element must be present: the
    ability to make an informed decision is appreciably impaired, a decision follows
    that would not otherwise have been taken, and **significant harm** is caused or
    reasonably likely. Intent is not required; the effect is enough.
  nl: |
    Artikel 5, lid 1, punt a), verbiedt het in de handel brengen, in gebruik stellen of
    gebruiken van een AI-systeem dat **subliminale technieken waarvan personen zich niet
    bewust zijn** of **doelbewust manipulatieve of misleidende technieken** gebruikt, met
    als doel of effect het gedrag wezenlijk te verstoren. Alle elementen moeten aanwezig
    zijn: het vermogen om een geïnformeerd besluit te nemen wordt merkbaar belemmerd, er
    volgt een ander besluit en er ontstaat **aanzienlijke schade**. Opzet is niet vereist.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 5(1)(a) AI Act
      nl: Artikel 5, lid 1, punt a), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # transparency-obligations
id: transparency-obligations
title:
  en: Does your system carry transparency obligations?
  nl: Gelden er transparantieverplichtingen voor uw systeem?
description:
  en: |
    Article 50 attaches **transparency obligations** to certain AI systems, whatever
    their risk classification. Paragraph 6 leaves the requirements of Chapter III intact.
    The Article holds **five situations** with two addressees: 1 and 2 bind the
    **provider**, 3 to 5 the **deployer**.

    Article 50(5): the information must be given **clearly and distinguishably, at the
    latest at the first interaction or exposure**. Article 50 applies from 2 August 2026.
  nl: |
    Artikel 50 verbindt **transparantieverplichtingen** aan bepaalde AI-systemen,
    ongeacht hun risicoclassificatie. Lid 6 laat hoofdstuk III onverlet. Het artikel
    bevat **vijf situaties** met twee adressaten: 1 en 2 binden de **aanbieder**, 3 tot
    en met 5 de **gebruiksverantwoordelijke**.

    Lid 5: de informatie wordt **duidelijk en te onderscheiden, uiterlijk bij de eerste
    interactie of blootstelling**, verstrekt. Artikel 50 geldt vanaf 2 augustus 2026.
