--- # end-of-walk
id: end-of-walk
title:
  en: The AI Act applies to your system - the walk ends here
  nl: De AI-verordening geldt voor uw systeem - einde doorloop
description:
  en: |
    You have worked through all six steps: the Act reaches you, your system is an AI
    system, it is not a prohibited practice, and you have answered the high-risk,
    general-purpose AI and transparency questions.

    **If step 4 found your system to be high-risk, that finding stands.** Article 50(6)
    leaves the Chapter III requirements intact. **The Tree stops here for now**:
    obligations, conformity assessment, registration, which role you are in and penalties
    are not in it, and it is not legal advice.
  nl: |
    U hebt alle zes stappen doorlopen: de verordening bereikt u, uw systeem is een
    AI-systeem, het is geen verboden praktijk, en u hebt de vragen over hoog risico, AI
    voor algemene doeleinden en transparantie beantwoord.

    **Als stap 4 heeft uitgewezen dat uw systeem een hoog risico heeft, blijft die
    bevinding staan.** **De boom stopt hier voorlopig**: verplichtingen,
    conformiteitsbeoordeling, registratie, uw rol en sancties staan er niet in, en dit is
    geen juridisch advies.
metadata:
  version: "0.2"
  owner-action: what follows after Article 50 is out of scope for this version (core document 3.3, item 7, and section 4)
