      nl: Artikel 5, lid 1, punt d), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # prohibited
id: prohibited
title:
  en: This is a prohibited practice
  nl: Dit is een verboden praktijk
description:
  en: |
    Your system falls under one of the practices prohibited by Article 5(1). There is no
    compliance route: depending on the point, the system may not be placed on the
    market, put into service or used.

    **This walk ends here, and that is deliberate.** The later steps ask what a system
    that may be used at all must do, and a prohibited practice has no such route. Check
    what the point prohibits, whether an exception applies and from when; if it does
    not bite, go back and answer **no**.
  nl: |
    Uw systeem valt onder een van de praktijken die artikel 5, lid 1, verbiedt. Er is
    geen route naar naleving: het systeem mag, afhankelijk van het punt, niet in de
    handel worden gebracht, in gebruik gesteld of gebruikt.

    **Deze doorloop eindigt hier, en dat is een bewuste keuze.** De volgende stappen
    gaan over systemen die gebruikt mogen worden. Ga na wat het punt verbiedt, of een
    uitzondering geldt en vanaf wanneer; gaat het verbod niet op, antwoord dan **nee**.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
