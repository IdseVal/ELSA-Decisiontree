--- # annex-i-legislation-2
id: annex-i-legislation-2
title:
  en: "Is your system a safety component, or a product, under Annex I? (2/3)"
  nl: "Is uw systeem een veiligheidscomponent of product onder bijlage I? (2/3)"
description:
  en: |
    A **safety component** fulfils a safety function for a product or an AI system, or
    its failure endangers health and safety. Article 6(1a): a system used **solely** for
    non-safety aspects - user assistance, performance, service efficiency, automation,
    convenience or quality control - is not one.

    Article 6(1b): a system whose failure would endanger health and safety is one.
    Article 6(1c): assessment required solely for other risks fails condition (b).
  nl: |
    Een **veiligheidscomponent** vervult een veiligheidsfunctie voor een product of
    AI-systeem, of het falen ervan brengt de veiligheid in gevaar. Artikel 6, lid 1 bis:
    een systeem dat **uitsluitend** voor niet-veiligheidsaspecten dient - bijstand,
    prestaties, efficiëntie, automatisering, gemak, kwaliteitscontrole - is er geen.

    Lid 1 ter: een systeem waarvan het falen de veiligheid in gevaar brengt, wel. Lid 1
    quater: een beoordeling om andere risico's voldoet niet aan b).
metadata:
  version: "0.2"
  step: 4a - high-risk, Annex I route
  annex-i-entries: "7 of 20 (Section A points 10 to 12, Section B points 13 to 16)"
