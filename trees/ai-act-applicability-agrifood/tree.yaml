    label:
      en: Annex III, point 4 AI Act (employment, workers management and access to self-employment)
      nl: Bijlage III, punt 4, AI-verordening (werkgelegenheid, personeelsbeheer en toegang tot zelfstandige arbeid)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III
