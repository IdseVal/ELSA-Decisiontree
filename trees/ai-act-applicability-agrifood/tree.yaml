--- # annex-i-machinery
id: annex-i-machinery
title:
  en: "Machinery"
  nl: "Machines"
description:
  en: |
    Annex I, Section B, point 21 lists **Regulation (EU) 2023/1230 on machinery**.

    **Section B**: under Article 2(2) only Article 6(1), Article 60a and Articles 102 to 112
    apply to a system that is high-risk through it. Added by Regulation (EU) 2026/1744,
    which deleted the Machinery Directive 2006/42/EC from Section A. For agrifood this is
    the broadest entry: harvesters, sorting and packing lines, milking robots, feed mixers.
  nl: |
    Bijlage I, afdeling B, punt 21, noemt **Verordening (EU) 2023/1230 betreffende
    machines**.

    **Afdeling B**: op grond van artikel 2, lid 2, gelden dan alleen artikel 6, lid 1,
    artikel 60 bis, en de artikelen 102 tot en met 112. Toegevoegd bij Verordening (EU)
    2026/1744, die de machinerichtlijn 2006/42/EG uit afdeling A schrapte. Voor agrifood is
    dit het breedste onderdeel: oogstmachines, sorteerlijnen, melkrobots, voermengers.
