--- # annex-i-legislation
id: annex-i-legislation
title:
  en: Is your system a safety component, or a product, under Annex I legislation?
  nl: Is uw systeem een veiligheidscomponent, of een product, onder wetgeving uit bijlage I?
description:
  en: |
    This is the first of the two routes to a **high-risk** classification. Article 6(1)
    makes an AI system high-risk when **both** of these conditions are met:

    - **(a)** the AI system is intended to be used as a **safety component of a product**,
      or the AI system **is itself a product**, covered by the Union harmonisation
      legislation listed in **Annex I**; **and**
    - **(b)** that product is required to undergo a **third-party conformity assessment**
      under that legislation before it is placed on the market or put into service.

    Both conditions. Being covered by Annex I legislation is not enough on its own, and
    this is the most common mistake at this step.

    "Safety component" means a component of a product or of an AI system that fulfils a
    safety function for it, or whose failure or malfunctioning endangers the health and
    safety of persons or property. A component fulfils a safety function where its intended
    purpose is to prevent or mitigate risks to health and safety. Three rules added by
    Regulation (EU) 2026/1744 sharpen this:

    - **Article 6(1a)**: systems used **solely** for non-safety-related aspects of user
      assistance, performance optimisation, service efficiency, automation, convenience or
      quality control **do not qualify** as safety components;
    - **Article 6(1b)**: notwithstanding that, systems whose failure or malfunctioning
      **would endanger health and safety do qualify**;
    - **Article 6(1c)**: a product required to undergo a third-party conformity assessment
      **solely** because of risks other than to health and safety - in particular radio
      spectrum or electromagnetic interference risks - does **not** meet condition (b).

    Annex I has **20** entries in two sections. **Section A** (points 2 to 12) is the New
    Legislative Framework legislation. **Section B** (points 13 to 21) is other Union
    harmonisation legislation, and Article 2(2) limits what applies to a Section B system:
    only Article 6(1), Article 60a and Articles 102 to 112. The entries most often reached
    by agrifood systems are agricultural and forestry vehicles, unmanned aircraft and
    machinery - all three in Section B.

    Note that the Machinery Directive 2006/42/EC, which was point 1 of Section A, was
    **deleted** by Regulation (EU) 2026/1744; machinery is now point 21 of Section B under
    Regulation (EU) 2023/1230.

    Open each entry to read what it covers, then come back here and answer. Answer **yes**
    only if **both** conditions of Article 6(1) are met.
  nl: |
    Dit is de eerste van de twee routes naar een classificatie als systeem met een **hoog
    risico**. Artikel 6, lid 1, merkt een AI-systeem als systeem met een hoog risico aan
    wanneer aan **beide** voorwaarden is voldaan:

    - **a)** het AI-systeem is bedoeld om te worden gebruikt als **veiligheidscomponent van
      een product**, of het AI-systeem **is zelf een product**, dat valt onder de in
      **bijlage I** opgenomen harmonisatiewetgeving van de Unie; **en**
    - **b)** voor dat product moet op grond van die wetgeving een
      **conformiteitsbeoordeling door een derde partij** worden uitgevoerd voordat het in
      de handel wordt gebracht of in gebruik wordt gesteld.

    Beide voorwaarden. Dat wetgeving uit bijlage I van toepassing is, volstaat op zichzelf
    niet, en dat is bij deze stap de meest gemaakte fout.

    "Veiligheidscomponent" betekent een component van een product of van een AI-systeem die
    daarvoor een veiligheidsfunctie vervult, of waarvan het falen of gebrekkig functioneren
    de gezondheid en veiligheid van personen of eigendom in gevaar brengt. Een component
    vervult een veiligheidsfunctie wanneer het beoogde doel ervan is risico’s voor de
    gezondheid en veiligheid te voorkomen of te beperken. Drie bij Verordening (EU)
    2026/1744 toegevoegde regels scherpen dit aan:

    - **artikel 6, lid 1 bis**: systemen die **uitsluitend** worden gebruikt voor
      niet-veiligheidsgerelateerde aspecten van bijstand aan gebruikers, optimalisering van
      de prestaties, efficiëntie van de dienstverlening, automatisering, gemak of
      kwaliteitscontrole worden **niet** als veiligheidscomponent aangemerkt;
    - **artikel 6, lid 1 ter**: niettegenstaande het voorgaande worden systemen waarvan het
      falen of gebrekkig functioneren de gezondheid en veiligheid in gevaar **zou brengen,
      wel** als veiligheidscomponent beschouwd;
    - **artikel 6, lid 1 quater**: een product dat **uitsluitend** vanwege andere risico’s
      dan die voor de gezondheid en veiligheid - met name risico’s in verband met het
      radiospectrum of elektromagnetische interferentie - aan een conformiteitsbeoordeling
      door een derde partij moet worden onderworpen, voldoet **niet** aan voorwaarde b).

    Bijlage I bevat **20** onderdelen in twee afdelingen. **Afdeling A** (punten 2 tot en
    met 12) is de wetgeving op basis van het nieuwe wetgevingskader. **Afdeling B** (punten
    13 tot en met 21) is andere harmonisatiewetgeving van de Unie, en artikel 2, lid 2,
    beperkt wat op een systeem uit afdeling B van toepassing is: uitsluitend artikel 6, lid
    1, artikel 60 bis, en de artikelen 102 tot en met 112. De onderdelen die
    agrifood-systemen het vaakst raken zijn landbouw- en bosbouwvoertuigen, onbemande
    luchtvaartuigen en machines - alle drie in afdeling B.

    Let op: de machinerichtlijn 2006/42/EG, punt 1 van afdeling A, is bij Verordening (EU)
    2026/1744 **geschrapt**; machines vallen nu onder punt 21 van afdeling B, Verordening
    (EU) 2023/1230.

    Open elk onderdeel om te lezen wat het inhoudt en kom daarna hier terug om te
    antwoorden. Antwoord **ja** alleen als aan **beide** voorwaarden van artikel 6, lid 1,
    is voldaan.
