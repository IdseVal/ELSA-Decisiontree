--- # exploiting-vulnerabilities
id: exploiting-vulnerabilities
title:
  en: Exploiting vulnerabilities of age, disability or a social or economic situation
  nl: Misbruik van kwetsbaarheden door leeftijd, handicap of een sociale of economische omstandigheid
description:
  en: |
    Article 5(1)(b) prohibits placing on the market, putting into service or using an AI
    system that **exploits any of the vulnerabilities** of a natural person or a specific
    group of persons **due to their age, disability, or a specific social or economic
    situation**, with the objective or the effect of materially distorting their
    behaviour, in a manner that causes or is reasonably likely to cause significant harm.

    The differences from point (a) are worth noting:

    - the lever is a listed vulnerability, not a technique;
    - the grounds are closed: age, disability, or a specific social or economic situation;
    - there is no requirement that the ability to make an informed decision be impaired -
      material distortion of behaviour and significant harm are enough.

    A "specific social or economic situation" can cover people in financial distress. In
    an agrifood setting, a system aimed at growers under acute economic pressure is the
    kind of case to test against this point.

    This is an explanation only. Go back to the previous step to answer.
  nl: |
    Artikel 5, lid 1, punt b), verbiedt het in de handel brengen, het in gebruik stellen of
    het gebruiken van een AI-systeem dat **gebruikmaakt van de kwetsbaarheden** van een
    natuurlijke persoon of specifieke groep personen **als gevolg van hun leeftijd,
    handicap of een specifieke sociale of economische omstandigheid**, met als doel of
    gevolg het gedrag wezenlijk te verstoren op een wijze die ertoe leidt of waarvan
    redelijkerwijs te verwachten is dat deze ertoe zal leiden dat aanzienlijke schade wordt
    opgelopen.

    De verschillen met punt a) zijn het opmerken waard:

    - het aangrijpingspunt is een genoemde kwetsbaarheid, niet een techniek;
    - de gronden zijn limitatief: leeftijd, handicap, of een specifieke sociale of
      economische omstandigheid;
    - er is niet vereist dat het vermogen om een geïnformeerd besluit te nemen wordt
      belemmerd - wezenlijke verstoring van het gedrag en aanzienlijke schade volstaan.

    Een "specifieke sociale of economische omstandigheid" kan zien op mensen in financiële
    nood. In een agrifood-context is een systeem dat zich richt op telers onder acute
    economische druk het soort geval dat u aan dit punt moet toetsen.

    Dit is alleen uitleg. Ga terug naar de vorige stap om te antwoorden.
