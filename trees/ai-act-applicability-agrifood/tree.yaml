--- # real-time-biometric-identification
id: real-time-biometric-identification
title:
  en: Real-time remote biometric identification in public
  nl: Biometrische identificatie op afstand in real time
description:
  en: |
    Article 5(1)(h) prohibits **the use** of real-time remote biometric identification
    **in publicly accessible spaces for law enforcement**, unless strictly necessary for
    a targeted search for victims of abduction, trafficking or sexual exploitation and
    for missing persons; the prevention of a specific, substantial and imminent threat
    to life or of a terrorist attack; or the localisation of a suspect of an Annex II
    offence punishable by at least four years. Article 5(2) to (7) then still apply.
  nl: |
    Artikel 5, lid 1, punt h), verbiedt **het gebruik** van biometrische identificatie op
    afstand in real time **in openbare ruimten met het oog op de rechtshandhaving**,
    tenzij strikt noodzakelijk voor het gericht zoeken naar slachtoffers van ontvoering,
    mensenhandel of seksuele uitbuiting en vermiste personen; het voorkomen van een
    imminente dreiging voor het leven of van een terroristische aanslag; of de lokalisatie
    van een verdachte van een in bijlage II genoemd strafbaar feit waarop ten minste vier
    jaar staat. Artikel 5, leden 2 tot en met 7, blijven gelden.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
