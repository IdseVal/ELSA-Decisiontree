--- # non-consensual-sexual-imagery
id: non-consensual-sexual-imagery
title:
  en: Non-consensual sexual imagery (from 2 December 2026)
  nl: Seksueel beeldmateriaal zonder toestemming (2-12-2026)
description:
  en: |
    Article 5(1)(ba), inserted by Regulation (EU) 2026/1744, prohibits placing on the
    market, putting into service or using an AI system that **generates or manipulates
    realistic sexual imagery of an identifiable person without that person's explicit
    consent**. Under Article 5(1a) a provider is caught only where this is the intended
    purpose, or a foreseeable and reproducible outcome that adequate safeguards do not
    prevent; a deployer only where they use it for that purpose. Applies from **2
    December 2026**.
  nl: |
    Artikel 5, lid 1, punt b bis), ingevoegd bij Verordening (EU) 2026/1744, verbiedt het
    in de handel brengen, in gebruik stellen of gebruiken van een AI-systeem dat
    **realistisch seksueel beeldmateriaal van een identificeerbare persoon genereert of
    manipuleert zonder diens uitdrukkelijke toestemming**. Artikel 5, lid 1 bis, raakt een
    aanbieder alleen bij beoogd doel of een voorzienbaar resultaat zonder afdoende
    waarborgen, en een gebruiksverantwoordelijke alleen bij dat gebruik. Vanaf **2
    december 2026**.
metadata:
