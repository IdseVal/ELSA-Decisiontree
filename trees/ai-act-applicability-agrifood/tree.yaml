  nl: Twee- of driewielige voertuigen en vierwielers
description:
  en: |
    Annex I, Section B, point 14 lists **Regulation (EU) No 168/2013 on the approval and
    market surveillance of two- or three-wheel vehicles and quadricycles**.

    Being covered by this legislation is not on its own enough. Article 6(1) makes an AI
    system high-risk only when **both** of its conditions are met: (a) the system is
