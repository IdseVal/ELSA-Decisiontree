--- # annex-iii-areas
id: annex-iii-areas
title:
  en: Does your system fall in a high-risk area of Annex III?
  nl: Valt uw systeem in een gebied met een hoog risico van bijlage III?
description:
  en: |
    The second route to **high-risk**. Article 6(2): the systems referred to in **Annex
    III** are high-risk. It lists **8 areas** covering 25 system types. Article 6(3):
    such a system is **not** high-risk where it poses no significant risk of harm, which
    applies where **any** of four conditions is met - a narrow procedural task, improving
    a completed human activity, detecting decision patterns, or a preparatory task - but
    it always is where it **performs profiling of natural persons**. Article 6(4): that
    assessment must be documented before the system is placed on the market.
  nl: |
    De tweede route naar een **hoog risico**. Artikel 6, lid 2: ook de in **bijlage III**
    bedoelde systemen zijn een hoog risico. Bijlage III noemt **8 gebieden** met 25 types
    systemen. Artikel 6, lid 3: zo'n systeem is **geen** hoog risico als het geen
    significant risico op schade inhoudt, wat geldt bij **één** van vier voorwaarden -
    een beperkte procedurele taak, verbetering van een voltooide menselijke activiteit,
    het opsporen van besluitvormingspatronen of een voorbereidende taak - maar altijd wel
    bij **profilering van natuurlijke personen**. Lid 4 vereist documentatie vooraf.
