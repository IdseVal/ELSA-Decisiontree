--- # annex-i-legislation-3
id: annex-i-legislation-3
title:
  en: "Is your system a safety component, or a product, under Annex I? (3/3)"
  nl: "Is uw systeem een veiligheidscomponent of product onder bijlage I? (3/3)"
description:
  en: |
    Annex I has **20** entries. **Section A** (points 2 to 12) is New Legislative
    Framework legislation; **Section B** (points 13 to 21) is other Union harmonisation
    legislation, and Article 2(2) limits what applies to a Section B system to Article
    6(1), Article 60a and Articles 102 to 112.

    The Machinery Directive 2006/42/EC, once point 1 of Section A, was **deleted** by
    Regulation (EU) 2026/1744; machinery is now point 21 of Section B. Answer **yes**
    only if both conditions of Article 6(1) are met.
  nl: |
    Bijlage I telt **20** onderdelen. **Afdeling A** (punten 2-12) is wetgeving op basis
    van het nieuwe wetgevingskader; voor **afdeling B** (punten 13-21) beperkt artikel 2,
    lid 2, wat geldt: artikel 6, lid 1, artikel 60 bis, en de artikelen 102 tot en met
    112.

    De machinerichtlijn 2006/42/EG, ooit punt 1 van afdeling A, is bij Verordening (EU)
    2026/1744 **geschrapt**; machines zijn nu punt 21 van afdeling B.
metadata:
  version: "0.2"
  step: 4a - high-risk, Annex I route
  annex-i-entries: "5 of 20 (Section B, points 17 to 21)"
