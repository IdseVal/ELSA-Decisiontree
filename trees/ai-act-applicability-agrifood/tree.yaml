  outcome: prohibited

--- # prohibited-practices
id: prohibited-practices
title:
  en: Does your system do a prohibited practice? (1/2)
  nl: Verricht uw systeem een verboden praktijk? (1/2)
description:
  en: |
    Article 5(1) lists AI practices that are **prohibited** outright. There is no
    compliance route: a system that does one of them may not be placed on the market,
    put into service or used at all. **Ten** practices are listed, five here and five on
    the next step.

    Points (ba) and (bb), the third and fourth entries, were inserted by Regulation (EU)
    2026/1744 and apply from **2 December 2026**; the other eight have applied since 2
    February 2025.
  nl: |
    Artikel 5, lid 1, noemt AI-praktijken die zonder meer **verboden** zijn. Er is geen
    route naar naleving: een systeem dat een daarvan verricht, mag niet in de handel
    worden gebracht, in gebruik worden gesteld of worden gebruikt. Er zijn **tien**
    praktijken, vijf hier en vijf in de volgende stap.

    De punten b bis) en b ter), het derde en vierde onderdeel, zijn ingevoegd bij
    Verordening (EU) 2026/1744 en gelden vanaf **2 december 2026**; de andere acht gelden
    sinds 2 februari 2025.
