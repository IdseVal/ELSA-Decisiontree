--- # emotion-recognition-at-work
id: emotion-recognition-at-work
title:
  en: Inferring emotions in the workplace or in education
  nl: Emoties afleiden op de werkplek of in het onderwijs
description:
  en: |
    Article 5(1)(f) prohibits placing on the market, putting into service for this
    purpose, or using AI systems **to infer emotions of a natural person in the areas of
    workplace and education institutions**, except where the system is intended for
    **medical or safety reasons**. The prohibition is tied to those two places;
    inferring emotions elsewhere may still be high-risk under Annex III or carry
    Article 50(3) transparency duties. Article 3(39) defines an emotion recognition
    system.
  nl: |
    Artikel 5, lid 1, punt f), verbiedt het in de handel brengen, voor dit doel in gebruik
    stellen of gebruiken van AI-systemen **om emoties van een natuurlijke persoon op de
    werkplek en in het onderwijs af te leiden**, behalve wanneer het systeem is bedoeld
    **uit medische of veiligheidsoverwegingen**. Het verbod is aan die twee plaatsen
    gebonden; elders kan het systeem wel een hoog risico vormen (bijlage III) of onder
    artikel 50, lid 3, vallen.
metadata:
  version: "0.2"
