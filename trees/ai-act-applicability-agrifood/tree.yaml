  en: Jurisdictional scope of the AI Act? (2/7)
  nl: Toepassingsgebied van de AI-verordening? (2/7)
description:
  en: |
    The second category of Article 2(1). Are you a **deployer** of an AI system who is
    established or located in the Union?

    A deployer uses an AI system under its own authority, other than in a purely
    personal, non-professional activity.
  nl: |
    De tweede categorie van artikel 2, lid 1. Bent u een
    **gebruiksverantwoordelijke** van een AI-systeem die in de Unie is gevestigd of zich
    er bevindt?

    Een gebruiksverantwoordelijke gebruikt een AI-systeem onder eigen
    verantwoordelijkheid, behalve in het kader van een louter persoonlijke
    niet-beroepsactiviteit.
