--- # annex-iii-biometrics
id: annex-iii-biometrics
title:
  en: Biometrics
  nl: Biometrie
description:
  en: |
    Annex III, area 1 applies **in so far as the use of these systems is permitted under
    Union or national law**, and lists three types: **(a)** remote biometric
    identification, which does **not** include **biometric verification** whose sole
    purpose is to confirm a claimed identity; **(b)** **biometric categorisation
    according to sensitive or protected attributes**; **(c)** **emotion recognition**.
    Check step 3 as well: Article 5(1)(f), (g) and (h) prohibit some of these outright.
  nl: |
    Bijlage III, gebied 1, geldt **voor zover het gebruik is toegestaan op grond van het
    Unierecht of nationale recht**, en noemt drie types: **a)** biometrische
    identificatie op afstand, met uitzondering van **biometrische verificatie** die
    alleen een geclaimde identiteit bevestigt; **b)** **biometrische categorisering op
    basis van gevoelige of beschermde kenmerken**; **c)** **emotieherkenning**. Toets ook
    stap 3: artikel 5, lid 1, punten f), g) en h), verbiedt sommige hiervan zonder meer.
metadata:
  version: "0.2"
  annex-iii-area: 1
  listed-system-types: 3
sources:
  - kind: legal
    label:
      en: Annex III, point 1 AI Act (biometrics)
      nl: Bijlage III, punt 1, AI-verordening (biometrie)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III
  - kind: legal
    label:
      en: Article 5(1)(f), (g), (h) AI Act (prohibited)
      nl: Artikel 5, lid 1, punten f), g) en h) (verboden)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # annex-iii-critical-infrastructure
id: annex-iii-critical-infrastructure
title:
  en: Critical infrastructure
  nl: Kritieke infrastructuur
description:
  en: |
    Annex III, area 2 is a single entry: *AI systems intended to be used as safety
    components in the management and operation of critical digital infrastructure, road
    traffic, or in the supply of water, gas, heating or electricity.*

    Three elements must line up: a **safety component**; used in the **management and
    operation**; of one of those infrastructures. For agrifood the entry to weigh is
    **the supply of water**, not irrigation on a single holding.
  nl: |
    Bijlage III, gebied 2, bestaat uit één onderdeel: *AI-systemen die bedoeld zijn om te
    worden gebruikt als veiligheidscomponent bij het beheer of de exploitatie van
    kritieke digitale infrastructuur, wegverkeer of bij de levering van water, gas,
    verwarming en elektriciteit.*

    Drie elementen moeten samenvallen: een **veiligheidscomponent**; gebruikt bij
    **beheer of exploitatie**; van die infrastructuur. Voor agrifood gaat het vooral om
    **de levering van water**, niet om beregening op één bedrijf.
metadata:
  version: "0.2"
  annex-iii-area: 2
  listed-system-types: 1
sources:
  - kind: legal
    label:
      en: Annex III, point 2 AI Act (critical infrastructure)
      nl: Bijlage III, punt 2, AI-verordening (infrastructuur)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III
  - kind: legal
    label:
      en: Article 3(14) and 6(1a) to (1c) AI Act
      nl: Artikel 3, punt 14, en artikel 6, leden 1 bis-1 quater
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_6

--- # annex-iii-education
id: annex-iii-education
title:
  en: Education and vocational training
  nl: Onderwijs en beroepsopleiding
description:
  en: |
    Annex III, area 3 lists four types, all tied to educational and vocational training
    institutions **at all levels**: **(a)** determining access or admission, or assigning
    persons to them; **(b)** evaluating learning outcomes, including where used to steer
    a learning process; **(c)** assessing the appropriate level of education a person
    will receive; **(d)** monitoring and detecting prohibited behaviour of students
    during tests. All four turn on the institutional setting; training an employer gives
    is tested against area 4.
  nl: |
    Bijlage III, gebied 3, noemt vier types, alle gebonden aan instellingen voor
    onderwijs en beroepsonderwijs **op alle niveaus**: **a)** het bepalen van toegang of
    toelating; **b)** het evalueren van leerresultaten, ook wanneer die het leerproces
    sturen; **c)** het beoordelen van het passende onderwijsniveau; **d)** het monitoren
    en detecteren van ongeoorloofd gedrag tijdens toetsen. Alle vier draaien om de
    instelling; opleiding door een werkgever wordt aan gebied 4 getoetst.
metadata:
  version: "0.2"
  annex-iii-area: 3
  listed-system-types: 4
sources:
  - kind: legal
    label:
      en: Annex III, point 3 AI Act (education)
      nl: Bijlage III, punt 3, AI-verordening (onderwijs)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III

--- # annex-iii-employment
id: annex-iii-employment
title:
  en: Employment, workers management and self-employment
  nl: Werkgelegenheid, personeelsbeheer en zelfstandige arbeid
description:
  en: |
    Annex III, area 4 lists two types: **(a)** systems for the **recruitment or
    selection** of persons, in particular targeted job advertisements, filtering
    applications and evaluating candidates; **(b)** systems to make **decisions affecting
    the terms of work-related relationships**, promotion or termination, **to allocate
    tasks** on individual behaviour or personal traits, or to **monitor and evaluate
    performance and behaviour**. The relationship need not be an employment contract.
  nl: |
    Bijlage III, gebied 4, noemt twee types: **a)** systemen voor het **werven of
    selecteren** van personen, met name gerichte vacatures, het filteren van sollicitaties
    en het beoordelen van kandidaten; **b)** systemen voor **besluiten over de voorwaarden
    van arbeidsgerelateerde betrekkingen**, bevordering of beëindiging, voor het
    **toewijzen van taken** op basis van gedrag of kenmerken, of voor het **monitoren en
    evalueren van prestaties en gedrag**. Een arbeidsovereenkomst is niet vereist.
metadata:
  version: "0.2"
  annex-iii-area: 4
  listed-system-types: 2
sources:
  - kind: legal
    label:
      en: Annex III, point 4 AI Act (employment)
      nl: Bijlage III, punt 4, AI-verordening (werkgelegenheid)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III
  - kind: legal
    label:
      en: Article 5(1)(f) AI Act (emotions at work, prohibited)
      nl: Artikel 5, lid 1, punt f) (emoties op het werk, verboden)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5

--- # annex-iii-essential-services
id: annex-iii-essential-services
title:
  en: Essential private and public services and benefits
  nl: Essentiële particuliere en publieke diensten en uitkeringen
description:
  en: |
    Annex III, area 5 lists four types: **(a)** systems used by or on behalf of public
    authorities to **evaluate eligibility for essential public assistance benefits and
    services**, or to grant, reduce, revoke or reclaim them; **(b)** **creditworthiness**
    or credit scoring of natural persons, except fraud detection; **(c)** **risk
    assessment and pricing in life and health insurance**; **(d)** **evaluating and
    classifying emergency calls** and dispatching first response services. Points (b) and
    (c) cover natural persons only; many farmers are sole traders.
  nl: |
    Bijlage III, gebied 5, noemt vier types: **a)** systemen die door of namens
    overheidsinstanties beoordelen of iemand **in aanmerking komt voor essentiële
    overheidsuitkeringen en -diensten**, of die verlenen, beperken, intrekken of
    terugvorderen; **b)** het beoordelen van **kredietwaardigheid** of kredietscores van
    natuurlijke personen, behalve fraudedetectie; **c)** **risicobeoordeling en
    prijsstelling bij levens- en ziektekostenverzekeringen**; **d)** het **evalueren en
    classificeren van noodoproepen**. De punten b) en c) zien alleen op natuurlijke
    personen.
metadata:
  version: "0.2"
  annex-iii-area: 5
  listed-system-types: 4
sources:
  - kind: legal
    label:
      en: Annex III, point 5 AI Act (essential services)
      nl: Bijlage III, punt 5, AI-verordening (essentiële diensten)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III

--- # annex-iii-justice-and-democracy
id: annex-iii-justice-and-democracy
title:
  en: Administration of justice and democratic processes
  nl: Rechtsbedeling en democratische processen
description:
  en: |
    Annex III, area 8 lists two types: **(a)** systems used by or on behalf of a
    **judicial authority to research and interpret facts and the law** and apply it to a
    concrete set of facts, or used the same way in **alternative dispute resolution**;
    **(b)** systems for **influencing the outcome of an election or referendum** or
    voting behaviour, excluding systems to whose output persons are not directly exposed,
    such as tools that organise a campaign administratively.
  nl: |
    Bijlage III, gebied 8, noemt twee types: **a)** systemen die door of namens een
    **gerechtelijke instantie** worden gebruikt om **feiten en het recht te onderzoeken
    en uit te leggen** en toe te passen op een concrete reeks feiten, of op dezelfde
    wijze bij **alternatieve geschillenbeslechting**; **b)** systemen voor het
    **beïnvloeden van de uitslag van een verkiezing of referendum** of van stemgedrag,
    behalve systemen aan de output waarvan personen niet rechtstreeks worden blootgesteld.
metadata:
  version: "0.2"
  annex-iii-area: 8
  listed-system-types: 2
sources:
  - kind: legal
    label:
      en: Annex III, point 8 AI Act (justice and democracy)
      nl: Bijlage III, punt 8, AI-verordening (rechtsbedeling)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III

--- # annex-iii-law-enforcement
id: annex-iii-law-enforcement
title:
  en: Law enforcement
  nl: Rechtshandhaving
description:
  en: |
    Annex III, area 6 applies **so far as the use is permitted under Union or national
    law** and lists five types, all defined by who uses them - law enforcement
    authorities or those acting for them: **(a)** assessing the risk of a person
    **becoming a victim**; **(b)** **polygraphs** and similar tools; **(c)** **evaluating
    the reliability of evidence**; **(d)** assessing the risk of **offending or
    re-offending**, not solely on profiling; **(e)** **profiling** during detection,
    investigation or prosecution. Solely on profiling, Article 5(1)(d) prohibits it.
  nl: |
    Bijlage III, gebied 6, geldt **voor zover het gebruik is toegestaan op grond van het
    Unierecht of nationale recht** en noemt vijf types, alle omschreven naar wie ze
    gebruikt - rechtshandhavingsinstanties of wie namens hen handelt: **a)** het risico
    dat iemand **slachtoffer wordt**; **b)** **leugendetectors**; **c)** het beoordelen
    van de **betrouwbaarheid van bewijs**; **d)** het risico op **(herhaald) plegen**,
    niet uitsluitend op profilering; **e)** **profilering** bij opsporing of vervolging.
    Uitsluitend op profilering verbiedt artikel 5, lid 1, punt d), dit.
metadata:
  version: "0.2"
  annex-iii-area: 6
  listed-system-types: 5
