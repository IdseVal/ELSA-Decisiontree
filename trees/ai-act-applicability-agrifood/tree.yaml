--- # annex-i-legislation-2
id: annex-i-legislation-2
title:
  en: "Is your system a safety component, or a product, under Annex I? (2/3)"
  nl: "Is uw systeem een veiligheidscomponent of product onder bijlage I? (2/3)"
description:
  en: |
    A **safety component** fulfils a safety function for a product or an [AI system](#ai-system), or its failure endangers health and safety.
  nl: |
    Een **veiligheidscomponent** vervult een veiligheidsfunctie voor een product of [AI-systeem](#ai-system), of het falen ervan brengt de veiligheid in gevaar.
metadata:
  version: "0.2"
  step: 4a - high-risk, Annex I route
  annex-i-entries: "7 of 20 (Section A points 10 to 12, Section B points 13 to 16)"
sources:
  - kind: legal
    label:
