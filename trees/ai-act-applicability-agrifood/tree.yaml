--- # social-scoring
id: social-scoring
title:
  en: Social scoring
  nl: Sociale scoring
description:
  en: |
    Article 5(1)(c) prohibits placing on the market, putting into service or using AI
    systems **for the evaluation or classification of natural persons or groups over a
    certain period of time** on their social behaviour or personal characteristics, where
    the resulting **social score** leads to detrimental or unfavourable treatment in
    social contexts **unrelated** to where the data was collected, or to treatment that
    is **unjustified or disproportionate** to the behaviour or its gravity.
  nl: |
    Artikel 5, lid 1, punt c), verbiedt het in de handel brengen, in gebruik stellen of
    gebruiken van AI-systemen **voor de evaluatie of classificatie van natuurlijke
    personen of groepen gedurende een bepaalde periode** op basis van sociaal gedrag of
    persoonlijke kenmerken, waarbij de **sociale score** leidt tot nadelige behandeling in
    een context die **geen verband houdt** met waar de data zijn verzameld, of tot een
    behandeling die **ongerechtvaardigd of onevenredig** is.
metadata:
  version: "0.2"
sources:
