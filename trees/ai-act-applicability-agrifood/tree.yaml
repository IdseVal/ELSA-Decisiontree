--- # high-risk
id: high-risk
title:
  en: Your system is high-risk under the AI Act
  nl: Uw systeem heeft een hoog risico onder de AI-verordening
description:
  en: |
    Your system is a **high-risk AI system**. Which route you came by matters: for a
    product covered by **Annex I, Section B**, Article 2(2) provides that only Article
    6(1), Article 60a and Articles 102 to 112 apply. Section A and Annex III systems
    carry the full Chapter III regime, which applies from 2 August 2028 and 2 December
    2027 respectively.

    **This step does not end the walk.** A high-risk system can carry Article 50 duties
    at the same time (Article 50(6)), so either answer continues.
  nl: |
    Uw systeem is een **AI-systeem met een hoog risico**. De route doet ertoe: voor een
    product dat onder **bijlage I, afdeling B**, valt, bepaalt artikel 2, lid 2, dat
    uitsluitend artikel 6, lid 1, artikel 60 bis, en de artikelen 102 tot en met 112 van
    toepassing zijn. Hoofdstuk III geldt vanaf 2 december 2027 (bijlage III) en 2
    augustus 2028 (bijlage I).

    **Deze stap beëindigt de doorloop niet.** Zo'n systeem kan tegelijk plichten uit
    artikel 50 dragen (artikel 50, lid 6); beide antwoorden lopen door.
metadata:
  version: "0.2"
  step: 4c - the high-risk finding
  traversal: |
    Not a Terminal (issue #24). The walk continues into steps 5 and 6 because a high-risk
    system can carry Article 50 obligations at the same time (Article 50(6)), and because
    the core document answers OPEN 10.7 that way. Neither Answer branches.
  owner-action: what follows from a high-risk outcome is the owner's later authoring (core document 3.3, item 7)
