    this Regulation have been incorporated in that legislation.

    Quadricycles used on holdings can fall here rather than under the agricultural and
    forestry vehicle Regulation; which one applies follows from the vehicle category, not
    from where it is driven.

    This is an explanation only. Go back to the previous step to answer.
