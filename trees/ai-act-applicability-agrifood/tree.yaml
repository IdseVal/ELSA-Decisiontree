--- # untargeted-facial-scraping
id: untargeted-facial-scraping
title:
  en: Untargeted scraping of facial images
  nl: Ongerichte scraping van gezichtsafbeeldingen
description:
  en: |
    Article 5(1)(e) prohibits placing on the market, putting into service for this
    purpose, or using AI systems that **create or expand facial recognition databases
    through the untargeted scraping of facial images from the internet or CCTV
    footage**.

    Three things to check: the purpose is a facial recognition database; it is created
    or expanded; the images come from *untargeted* scraping. There is no harm threshold
    and no exception here.
  nl: |
    Artikel 5, lid 1, punt e), verbiedt het in de handel brengen, voor dit doel in gebruik
    stellen of gebruiken van AI-systemen **die databanken voor gezichtsherkenning
    aanleggen of aanvullen door ongerichte scraping van gezichtsafbeeldingen van internet
    of CCTV-beelden**.

    Drie dingen om na te gaan: het doel is zo'n databank; die wordt aangelegd of
    aangevuld; de afbeeldingen komen uit *ongerichte* scraping. Er is geen schadedrempel
    en geen uitzondering.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 5(1)(e) AI Act
      nl: Artikel 5, lid 1, punt e), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5
