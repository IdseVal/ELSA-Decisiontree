--- # prohibited-practices-2
id: prohibited-practices-2
title:
  en: Does your system do a prohibited practice? (2/2)
  nl: Verricht uw systeem een verboden praktijk? (2/2)
description:
  en: |
    The last five practices of Article 5(1). Most points cover placing on the market,
    putting into service *and* use, so they can catch you whether you build the system
    or only use it. Point (h), the last entry, covers only the use, and only by law
    enforcement.

    Article 5(8) adds that this Article does not affect prohibitions that apply where an
    AI practice infringes other Union law.
  nl: |
    De laatste vijf praktijken van artikel 5, lid 1. De meeste punten bestrijken het in
    de handel brengen, het in gebruik stellen *en* het gebruiken, en kunnen u dus raken
    of u het systeem nu bouwt of alleen gebruikt. Punt h), het laatste onderdeel,
    bestrijkt alleen het gebruik met het oog op de rechtshandhaving.

    Artikel 5, lid 8, doet geen afbreuk aan verbodsbepalingen die gelden wanneer een
    AI-praktijk inbreuk maakt op ander Unierecht.
