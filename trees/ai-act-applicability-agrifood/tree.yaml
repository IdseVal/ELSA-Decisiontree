      nl: Artikel 5 AI-verordening (verboden AI-praktijken)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5
  - kind: legal
    label:
      en: Article 113(3)(a) AI Act as amended (from when)
      nl: Artikel 113, lid 3, punt a), AI-verordening (vanaf wanneer)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_113
