  en: "Equipment for potentially explosive atmospheres"
  nl: "Apparaten voor plaatsen met ontploffingsgevaar"
description:
  en: |
    Annex I, Section A, point 5 lists **Directive 2014/34/EU relating to equipment and
    protective systems intended for use in potentially explosive atmospheres**.

    **Section A** is New Legislative Framework legislation: a system that is high-risk
    through it falls under the full high-risk regime of Chapter III. Relevant to agrifood
    wherever combustible dust is handled: grain silos, feed mills, flour and sugar
    processing.
  nl: |
    Bijlage I, afdeling A, punt 5, noemt **Richtlijn 2014/34/EU inzake apparaten en
    beveiligingssystemen op plaatsen waar ontploffingsgevaar kan heersen**.

    **Afdeling A** is wetgeving op basis van het nieuwe wetgevingskader: een systeem dat
    daardoor een hoog risico vormt, valt onder het volledige regime van hoofdstuk III.
    Relevant voor agrifood overal waar brandbaar stof voorkomt: graansilo’s,
    mengvoederfabrieken, meel- en suikerverwerking.
