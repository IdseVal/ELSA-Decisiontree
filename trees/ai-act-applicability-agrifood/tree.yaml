--- # annex-i-legislation
id: annex-i-legislation
title:
  en: "Is your system a safety component, or a product, under Annex I? (1/3)"
  nl: "Is uw systeem een veiligheidscomponent of product onder bijlage I? (1/3)"
description:
  en: |
    The first route to **high-risk**. Article 6(1) applies when **both** are met:
    **(a)** the system is intended as a **safety component of a product**, or is itself
    a product, covered by **Annex I** legislation; **and (b)** that product must undergo
    a **third-party conformity assessment** first.

    Annex I legislation alone is not enough. These are points 2 to 9 of the 20, all
    **Section A**: for Section A, Article 2(13) lets the Commission limit Articles 9 to
    15 and 17 to 25 by delegated act.
  nl: |
    De eerste route naar een **hoog risico**. Artikel 6, lid 1, vereist **beide**: **a)**
    het systeem is bedoeld als **veiligheidscomponent van een product**, of is zelf zo'n
    product, dat onder **bijlage I** valt; **en b)** dat product vereist een
    **conformiteitsbeoordeling door een derde partij**.

    Alleen bijlage I-wetgeving volstaat niet. De punten 2 tot en met 9 zijn alle
    **afdeling A**: artikel 2, lid 13, laat de Commissie daarvoor de artikelen 9 tot en
    met 15 en 17 tot en met 25 bij gedelegeerde handeling beperken.
metadata:
  version: "0.2"
  step: 4a - high-risk, Annex I route
  annex-i-entries: "8 of 20 (Section A, points 2 to 9)"
