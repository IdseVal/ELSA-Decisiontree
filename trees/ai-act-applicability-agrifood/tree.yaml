--- # biometric-categorisation
id: biometric-categorisation
title:
  en: Biometric categorisation to infer race, beliefs or sex life
  nl: Biometrische categorisering (ras, overtuiging, seksleven)
description:
  en: |
    Article 5(1)(g) prohibits placing on the market, putting into service for this
    purpose, or using **biometric categorisation systems that categorise individual
    natural persons on their biometric data to deduce or infer** race, political
    opinions, trade union membership, religious or philosophical beliefs, sex life or
    sexual orientation. Labelling or filtering lawfully acquired biometric datasets, and
    categorising in the area of law enforcement, are excluded. Article 3(40) defines the
    system.
  nl: |
    Artikel 5, lid 1, punt g), verbiedt het in de handel brengen, voor dit doel in gebruik
    stellen of gebruiken van **systemen voor biometrische categorisering die personen
    individueel indelen op biometrische gegevens om** ras, politieke opvattingen,
    vakbondslidmaatschap, religieuze of levensbeschouwelijke overtuigingen, seksleven of
    seksuele gerichtheid **af te leiden**. Labelen of filteren van rechtmatig verkregen
    datasets en categorisering bij rechtshandhaving vallen erbuiten.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 5(1)(g) AI Act
      nl: Artikel 5, lid 1, punt g), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5
  - kind: legal
    label:
      en: Article 3(40) AI Act (biometric categorisation)
      nl: Artikel 3, punt 40, AI-verordening (categorisering)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_3

--- # child-sexual-abuse-material
id: child-sexual-abuse-material
title:
  en: Child sexual abuse material (from 2 December 2026)
  nl: Materiaal van seksueel kindermisbruik (2-12-2026)
description:
  en: |
    Article 5(1)(bb), inserted by Regulation (EU) 2026/1744, prohibits placing on the
    market, putting into service or using an AI system that **generates or manipulates
    material or performance within the meaning of Article 2, points (c) and (e), of
    Directive 2011/93/EU**, except where a "without right" defence applies under national
    law. The conditions of Article 5(1a) apply as they do for point (ba). Applies from
    **2 December 2026**.
  nl: |
    Artikel 5, lid 1, punt b ter), ingevoegd bij Verordening (EU) 2026/1744, verbiedt het
    in de handel brengen, in gebruik stellen of gebruiken van een AI-systeem dat
    **materiaal of een voorstelling genereert of manipuleert in de zin van artikel 2,
    punten c) en e), van Richtlijn 2011/93/EU**, behalve wanneer het nationale recht een
    "wederrechtelijke" verdediging kent. De voorwaarden van artikel 5, lid 1 bis, gelden
    net als bij punt b bis). Vanaf **2 december 2026**.
