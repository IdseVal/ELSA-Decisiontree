    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#anx_III

--- # article-2-exclusions
id: article-2-exclusions
title:
  en: Does a full exclusion in Article 2 cover your system?
  nl: Valt uw systeem onder een volledige uitsluiting van artikel 2?
description:
  en: |
    One of the seven categories of Article 2(1) describes you, so the Act reaches you.
    Article 2 also takes some systems and activities back out of the Act; the entries
    below are those exclusions. Open one to read what it covers.

    Answer **yes** only if a **full** exclusion covers your system: the Act then does
    not apply to it, and the walk ends. The free and open-source exclusion is only
    partial, so it is no reason to answer yes.
  nl: |
    Een van de zeven categorieën van artikel 2, lid 1, geldt voor u, dus de verordening
    bereikt u. Artikel 2 haalt ook systemen en activiteiten weer buiten de verordening;
    de onderdelen hieronder zijn die uitsluitingen.

    Antwoord **ja** alleen als een **volledige** uitsluiting uw systeem dekt: de
    verordening geldt dan niet en de doorloop eindigt. De uitsluiting voor
    opensourcelicenties is slechts gedeeltelijk en dus geen reden voor ja.
metadata:
  version: "0.2"
  step: 1 - jurisdictional scope
sources:
  - kind: legal
    label:
      en: Article 2 AI Act (scope and exclusions)
      nl: Artikel 2 AI-verordening (uitsluitingen)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2
options:
  - title:
      en: Military, defence or national security purposes
      nl: Militaire, defensie- of nationale veiligheidsdoeleinden
    target: exclusion-national-security
  - title:
      en: Third-country authorities in law enforcement cooperation
      nl: Autoriteiten van derde landen bij rechtshandhaving
    target: exclusion-third-country-authorities
  - title:
      en: Sole purpose of scientific research and development
      nl: Uitsluitend wetenschappelijk onderzoek en ontwikkeling
    target: exclusion-scientific-research
  - title:
      en: Research or testing before placing on the market
      nl: Onderzoek of tests vóór het in de handel brengen
    target: exclusion-research-and-development
  - title:
      en: A natural person using a system in a personal activity
      nl: Natuurlijke persoon in een persoonlijke activiteit
    target: exclusion-personal-use
  - title:
      en: Free and open-source licences (partial exclusion only)
      nl: Vrije en opensourcelicenties (slechts gedeeltelijk)
    target: exclusion-open-source
