  no: ai-system-definition

--- # article-50-deep-fakes
id: article-50-deep-fakes
title:
  en: Deep fakes (deployer)
  nl: Deepfakes (gebruiksverantwoordelijke)
description:
  en: |
    **Article 50(4), first subparagraph.** Deployers of an AI system that generates or
    manipulates image, audio or video content constituting a **deep fake** must
    **disclose that the content has been artificially generated or manipulated**. Article
    3(60) covers content resembling existing persons, **objects, places, entities or
    events** that would falsely appear authentic. Law-enforcement use authorised by law
    is excepted; for an evidently artistic, creative, satirical or fictional work the
    disclosure is limited to its existence.
  nl: |
    **Artikel 50, lid 4, eerste alinea.** Gebruiksverantwoordelijken van een AI-systeem
    dat beeld-, audio- of videocontent genereert of bewerkt die een **deepfake** vormt,
    **maken bekend dat de content kunstmatig is gegenereerd of gemanipuleerd**. Artikel 3,
    punt 60, ziet ook op **voorwerpen, plaatsen, entiteiten of gebeurtenissen**. Bij wet
    toegestaan gebruik voor strafbare feiten is uitgezonderd; bij een duidelijk artistiek,
    creatief, satirisch of fictief werk beperkt de plicht zich tot het bestaan ervan.
metadata:
  version: "0.2"
  article-50-situation: 4
  addressee: deployer
sources:
  - kind: legal
    label:
      en: Article 50(4), first subparagraph, AI Act
      nl: Artikel 50, lid 4, eerste alinea, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50
  - kind: legal
    label:
      en: Article 3(60) AI Act (deep fake)
      nl: Artikel 3, punt 60, AI-verordening (deepfake)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_3

--- # article-50-direct-interaction
id: article-50-direct-interaction
title:
  en: Systems that interact directly with people (provider)
  nl: Directe interactie met mensen (aanbieder)
description:
  en: |
    **Article 50(1).** Providers must ensure that AI systems **intended to interact
    directly with natural persons** are designed and developed so that those persons
    **are informed that they are interacting with an AI system**. This does not apply
    where that is **obvious** to a reasonably well-informed, observant and circumspect
    person in the context of use, nor to systems authorised by law to detect, prevent,
    investigate or prosecute criminal offences - unless they are available for the public
    to report an offence.
  nl: |
    **Artikel 50, lid 1.** Aanbieders zorgen ervoor dat AI-systemen die **voor directe
    interactie met natuurlijke personen zijn bedoeld** zo worden ontworpen dat die
    personen **worden geïnformeerd dat zij met een AI-systeem interageren**. Dit geldt
    niet wanneer dat **duidelijk** is voor een normaal geïnformeerde, omzichtige en
    oplettende persoon in de gebruikscontext, en evenmin voor bij wet toegestane systemen
    voor het opsporen of vervolgen van strafbare feiten - tenzij het publiek daarmee een
    strafbaar feit kan melden.
metadata:
  version: "0.2"
  article-50-situation: 1
  addressee: provider
sources:
  - kind: legal
    label:
      en: Article 50(1) AI Act
      nl: Artikel 50, lid 1, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50

--- # article-50-emotion-and-biometric
id: article-50-emotion-and-biometric
title:
  en: Emotion recognition or biometric categorisation (deployer)
  nl: Emotieherkenning of biometrische categorisering
description:
  en: |
    **Article 50(3).** Deployers of an **emotion recognition system** or a **biometric
    categorisation system** must **inform the natural persons exposed to it of the
    operation of the system**, and process the personal data in accordance with
    Regulation (EU) 2016/679, Regulation (EU) 2018/1725 and Directive (EU) 2016/680. It
    does not apply to systems permitted by law to detect, prevent or investigate criminal
    offences. Check step 3 first: Article 5(1)(f) and (g) prohibit some of these outright.
  nl: |
    **Artikel 50, lid 3.** Gebruiksverantwoordelijken van een **systeem voor
    emotieherkenning** of **biometrische categorisering** **informeren de blootgestelde
    natuurlijke personen over de werking van het systeem** en verwerken persoonsgegevens
    volgens Verordening (EU) 2016/679, Verordening (EU) 2018/1725 en Richtlijn (EU)
    2016/680. Dit geldt niet voor bij wet toegestane systemen voor het opsporen van
    strafbare feiten. Toets eerst stap 3: artikel 5, lid 1, punten f) en g), verbiedt
    sommige hiervan.
metadata:
  version: "0.2"
  article-50-situation: 3
  addressee: deployer
sources:
  - kind: legal
    label:
      en: Article 50(3) AI Act
      nl: Artikel 50, lid 3, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50
  - kind: legal
    label:
      en: Article 3(39) and (40) AI Act (definitions)
      nl: Artikel 3, punten 39 en 40, AI-verordening (definities)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_3

--- # article-50-generated-text
id: article-50-generated-text
title:
  en: AI-generated text informing the public (deployer)
  nl: Door AI gegenereerde tekst voor het publiek
description:
  en: |
    **Article 50(4), second subparagraph.** Deployers of an AI system that generates or
    manipulates **text published with the purpose of informing the public on matters of
    public interest** must **disclose that the text has been artificially generated or
    manipulated**. It does not apply where the use is authorised by law for
    criminal-offence purposes, or where the content **has undergone human review or
    editorial control** **and** a natural or legal person **holds editorial
    responsibility** for its publication.
  nl: |
    **Artikel 50, lid 4, tweede alinea.** Gebruiksverantwoordelijken van een AI-systeem
    dat **tekst genereert of bewerkt die wordt gepubliceerd om het publiek te informeren
    over aangelegenheden van algemeen belang**, **maken bekend dat de tekst kunstmatig is
    gegenereerd of bewerkt**. Dit geldt niet bij wettelijk toegestaan gebruik voor
    strafbare feiten, of wanneer de content **menselijke toetsing of redactionele
    controle heeft ondergaan** **en** iemand **redactionele verantwoordelijkheid draagt**.
metadata:
  version: "0.2"
  article-50-situation: 5
  addressee: deployer
sources:
  - kind: legal
    label:
      en: Article 50(4), second subparagraph, AI Act
      nl: Artikel 50, lid 4, tweede alinea, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50

--- # article-50-synthetic-content
id: article-50-synthetic-content
title:
  en: Systems generating synthetic content (provider)
  nl: Systemen die synthetische content genereren (aanbieder)
description:
  en: |
    **Article 50(2).** Providers of AI systems (**including general-purpose AI systems**)
    that generate **synthetic audio, image, video or text** must ensure the outputs are
    **marked in a machine-readable format and detectable as artificially generated**. It
    does not apply where the system performs an **assistive function for standard
    editing**, does **not substantially alter** the deployer's input, or is authorised by
    law for criminal-offence purposes. Article 111(4) gives systems on the market before
    2 August 2026 until 2 December 2026.
  nl: |
    **Artikel 50, lid 2.** Aanbieders van AI-systemen - **ook systemen voor algemene
    doeleinden** - die **synthetische audio, beelden, video of tekst** genereren, zorgen
    dat de output **machineleesbaar is gemarkeerd en detecteerbaar als kunstmatig
    gegenereerd of gemanipuleerd**. Dit geldt niet voor systemen met een
    **ondersteunende functie voor standaardbewerking**, systemen die de input van de
    gebruiksverantwoordelijke **niet wezenlijk wijzigen**, of bij wet toegestane systemen.
    Artikel 111, lid 4, geeft systemen van vóór 2 augustus 2026 tot 2 december 2026.
metadata:
  version: "0.2"
  article-50-situation: 2
  addressee: provider
sources:
  - kind: legal
    label:
      en: Article 50(2) AI Act
      nl: Artikel 50, lid 2, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50
