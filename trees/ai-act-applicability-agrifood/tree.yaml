--- # jurisdiction-affected-person
id: jurisdiction-affected-person
title:
  en: Jurisdictional scope of the AI Act? (7/7)
  nl: Toepassingsgebied van de AI-verordening? (7/7)
description:
  en: |
    The last category of Article 2(1). Are you an **affected person** located in the
    Union?

    A **no** here means that none of the seven categories describes you: the Act does
    not reach you, and the walk ends.
  nl: |
    De laatste categorie van artikel 2, lid 1. Bent u een **getroffen persoon** die zich
    in de Unie bevindt?

    **Nee** betekent hier dat geen van de zeven categorieën op u van toepassing is: de
    verordening bereikt u niet en de doorloop eindigt.
metadata:
  version: "0.2"
  step: 1 - jurisdictional scope
sources:
