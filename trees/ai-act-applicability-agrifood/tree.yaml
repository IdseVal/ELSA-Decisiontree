--- # annex-iii-migration-and-borders
id: annex-iii-migration-and-borders
title:
  en: Migration, asylum and border control management
  nl: Migratie-, asiel- en grenstoezichtsbeheer
description:
  en: |
    Annex III, area 7 applies **so far as the use is permitted under Union or national
    law** and lists four types, all defined by who uses them - competent public
    authorities or those acting for them: **(a)** **polygraphs** and similar tools;
    **(b)** assessing a **security, irregular migration or health risk** posed by a
    person entering a Member State; **(c)** assisting the **examination of applications**
    for asylum, visa or residence permits; **(d)** **detecting, recognising or
    identifying** persons, except the verification of travel documents.
  nl: |
    Bijlage III, gebied 7, geldt **voor zover het gebruik is toegestaan op grond van het
    Unierecht of nationale recht** en noemt vier types, alle omschreven naar wie ze
    gebruikt - bevoegde overheidsinstanties of wie namens hen handelt: **a)**
    **leugendetectors**; **b)** het beoordelen van een **veiligheids-, migratie- of
    gezondheidsrisico** van wie een lidstaat binnenkomt; **c)** hulp bij de **behandeling
    van aanvragen** voor asiel, visa of verblijf; **d)** het **opsporen, herkennen of
    identificeren** van personen, behalve verificatie van reisdocumenten.
metadata:
  version: "0.2"
  annex-iii-area: 7
  listed-system-types: 4
sources:
  - kind: legal
