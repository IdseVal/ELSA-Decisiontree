--- # start
id: start
title:
  en: Jurisdictional scope of the AI Act? (1/7)
  nl: Toepassingsgebied van de AI-verordening? (1/7)
description:
  en: |
    Article 2(1) lists **seven** categories of people and organisations the Act
    reaches; these steps take one each. Are you a **provider** who places an AI system
    on the Union market or puts it into service in the Union, or who places a
    general-purpose AI model on the Union market?

    Being established in the Union or in a third country makes no difference. A
    provider develops a system, or has one developed, and places it under its own name
    or trademark. A **yes** leads to the Article 2 exclusions.
  nl: |
    Artikel 2, lid 1, noemt **zeven** categorieën die de verordening bereikt; elke stap
    behandelt er één. Bent u een **aanbieder** die een AI-systeem in de Unie in de handel
    brengt of in gebruik stelt, of een AI-model voor algemene doeleinden in de Unie in de
    handel brengt?

    Waar u gevestigd bent, maakt niet uit. Een aanbieder ontwikkelt een systeem of laat
    het ontwikkelen en brengt het onder eigen naam of merk in de handel. Na elk **ja**
    volgen de uitsluitingen van artikel 2.
metadata:
  version: "0.2"
  step: 1 - jurisdictional scope
sources:
  - id: art-2-1
