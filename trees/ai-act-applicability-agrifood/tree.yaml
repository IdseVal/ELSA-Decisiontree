--- # transparency-obligations
id: transparency-obligations
title:
  en: Does your system carry transparency obligations?
  nl: Gelden er transparantieverplichtingen voor uw systeem?
description:
  en: |
    Article 50 attaches **transparency obligations** to certain [AI systems](#ai-system), whatever their risk classification.
  nl: |
    Artikel 50 verbindt **transparantieverplichtingen** aan bepaalde [AI-systemen](#ai-system), ongeacht hun risicoclassificatie. Lid 6 laat hoofdstuk III onverlet.
metadata:
  version: "0.2"
  step: 6 - transparency obligations
  article-50-situations: "5 (paragraphs 1, 2, 3, 4 first subparagraph, 4 second subparagraph)"
sources:
  - id: art-50
    kind: legal
    label:
      en: Article 50 AI Act (transparency obligations)
      nl: Artikel 50 AI-verordening (transparantieverplichtingen)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50
  - kind: legal
    label:
      en: Article 113 AI Act as amended (application dates)
      nl: Artikel 113 AI-verordening (toepassingsdata)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_113
images:
  - file: step-transparency.jpg
    description:
      en: "A chatbot on a phone: Article 50 wants the reader told it is a machine"
      nl: "Een chatbot op een telefoon: artikel 50 wil dat u weet dat het een machine is"
    credit: "piqsels, via Wikimedia Commons, CC0 1.0"
    source: art-50
options:
  - title:
      en: 1. Systems that interact directly with people (provider)
      nl: 1. Directe interactie met mensen (aanbieder)
    target: article-50-direct-interaction
  - title:
      en: 2. Systems generating synthetic content (provider)
      nl: 2. Systemen die synthetische content genereren (aanbieder)
    target: article-50-synthetic-content
  - title:
      en: 3. Emotion recognition or biometric categorisation
      nl: 3. Emotieherkenning of biometrische categorisering
    target: article-50-emotion-and-biometric
  - title:
      en: 4. Deep fakes (deployer)
      nl: 4. Deepfakes (gebruiksverantwoordelijke)
    target: article-50-deep-fakes
  - title:
      en: 5. AI-generated text informing the public (deployer)
      nl: 5. Door AI gegenereerde tekst voor het publiek
    target: article-50-generated-text
explainers:
  - id: ai-system
    term:
      en: AI system
      nl: AI-systeem
    text:
      en: A machine-based system that works with varying levels of autonomy and infers from the input it receives how to generate outputs, such as predictions, content, recommendations or decisions.
      nl: Een op een machine gebaseerd systeem dat met wisselende autonomie werkt en uit de ontvangen input afleidt hoe output te genereren, zoals voorspellingen, inhoud, aanbevelingen of beslissingen.
answers:
  yes: end-of-walk
  no: end-of-walk

--- # untargeted-facial-scraping
id: untargeted-facial-scraping
title:
  en: Untargeted scraping of facial images
  nl: Ongerichte scraping van gezichtsafbeeldingen
description:
  en: |
    Article 5(1)(e) prohibits placing on the market, putting into service for this purpose, or using AI systems that **create or expand facial…**
  nl: |
    Artikel 5, lid 1, punt e), verbiedt het in de handel brengen, voor dit doel in gebruik stellen of gebruiken van AI-systemen **die databanken voor…**
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 5(1)(e) AI Act
      nl: Artikel 5, lid 1, punt e), AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_5
images:
  - file: prohibited-facial-scraping.jpg
    description:
      en: "A CCTV camera mounted on a wall"
      nl: "Een bewakingscamera aan een muur"
    credit: "MichalPL, via Wikimedia Commons, CC BY-SA 4.0"
