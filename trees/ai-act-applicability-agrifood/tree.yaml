    label:
      en: Article 50(4), first subparagraph, AI Act
      nl: Artikel 50, lid 4, eerste alinea, AI-verordening
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_50
