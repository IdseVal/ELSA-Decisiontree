--- # ai-act-does-not-apply
id: ai-act-does-not-apply
title:
  en: The AI Act does not apply
  nl: De AI-verordening is niet van toepassing
description:
  en: |
    None of the seven categories of Article 2(1) describes you, or an Article 2
    exclusion covers your system entirely. The AI Act does not apply, and this walk ends
    here.

    The exclusions are narrow: several turn on the word *exclusively*, so a system
    placed on the market for an excluded **and** a non-excluded purpose stays inside the
    Act. Other law may still apply, and if you later place the system on the Union
    market the answer changes.
  nl: |
    Geen van de zeven categorieën van artikel 2, lid 1, is op u van toepassing, of een
    uitsluiting van artikel 2 geldt volledig voor uw systeem. De AI-verordening is niet
    van toepassing en deze doorloop eindigt hier.

    De uitsluitingen zijn eng en hangen vaak af van het woord *uitsluitend*: een systeem
    dat ook voor een niet-uitgesloten doel in de handel wordt gebracht, blijft binnen de
    verordening. Ander recht kan nog gelden, en brengt u het systeem later in de Unie in
    de handel, dan verandert het antwoord.
metadata:
  version: "0.2"
sources:
  - kind: legal
    label:
      en: Article 2 AI Act (scope)
      nl: Artikel 2 AI-verordening (toepassingsgebied)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2
terminal:
  outcome: not-applicable

--- # ai-system-definition
id: ai-system-definition
title:
  en: Is your system an AI system within the meaning of the Act?
  nl: Is uw systeem een AI-systeem in de zin van de verordening?
description:
  en: |
    Article 3(1): an *AI system* is a machine-based system designed to operate with
    varying levels of autonomy, that may exhibit adaptiveness after deployment and that,
    for explicit or implicit objectives, **infers from the input it receives how to
    generate outputs** - predictions, content, recommendations or decisions - that can
    influence physical or virtual environments. Inferring is the distinguishing element:
    as Recital 12 says, the definition does not cover systems based on rules defined
    solely by natural persons.
  nl: |
    Artikel 3, punt 1: een *AI-systeem* is een op een machine gebaseerd systeem dat met
    verschillende niveaus van autonomie werkt, dat na het inzetten aanpassingsvermogen
    kan vertonen en dat, voor expliciete of impliciete doelstellingen, **uit de ontvangen
    input afleidt hoe output te genereren** die van invloed kan zijn op fysieke of
    virtuele omgevingen. Het afleiden is het onderscheidende element: volgens overweging
    12 omvat de definitie geen systemen op basis van regels die uitsluitend door
    natuurlijke personen zijn vastgesteld.
metadata:
  version: "0.2"
  step: 2 - material scope
sources:
  - id: art-3-1
    kind: legal
    label:
      en: Article 3(1) AI Act (definition of an AI system)
      nl: Artikel 3, punt 1, AI-verordening (definitie)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_3
  - kind: legal
    label:
      en: Recital 12 AI Act (the elements of the definition)
      nl: Overweging 12 AI-verordening (elementen van de definitie)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
images:
  - file: step-ai-system.jpg
    description:
      en: "A banana and a photo of one, each labelled by an object-detection model"
      nl: "Een banaan en een foto ervan, elk gelabeld door een objectherkenningsmodel"
    credit: "Max Gruber, via Wikimedia Commons, CC BY 4.0"
    source: art-3-1
answers:
  yes: prohibited-practices
  no: not-an-ai-system

--- # annex-i-agricultural-vehicles
id: annex-i-agricultural-vehicles
title:
  en: "Agricultural and forestry vehicles"
  nl: "Landbouw- en bosbouwvoertuigen"
description:
  en: |
    Annex I, Section B, point 15 lists **Regulation (EU) No 167/2013 on the approval and
    market surveillance of agricultural and forestry vehicles**.

    **Section B**: under Article 2(2) only Article 6(1), Article 60a and Articles 102 to 112
    apply to a system that is high-risk through it. The entry most agrifood systems reach
    first: tractors, trailers and towed and interchangeable towed equipment. An AI system
    that steers or brakes such a vehicle is the case Article 6(1) describes.
  nl: |
    Bijlage I, afdeling B, punt 15, noemt **Verordening (EU) nr. 167/2013 inzake de
    goedkeuring van en het markttoezicht op landbouw- en bosbouwvoertuigen**.

    **Afdeling B**: op grond van artikel 2, lid 2, gelden dan alleen artikel 6, lid 1,
    artikel 60 bis, en de artikelen 102 tot en met 112. Het onderdeel dat agrifood het
    vaakst raakt: trekkers, aanhangwagens en getrokken uitrusting. Een AI-systeem dat daarop
    stuurt of remt, valt onder artikel 6, lid 1.
metadata:
