    product moet op grond van die wetgeving een **conformiteitsbeoordeling door een derde
    partij** worden uitgevoerd voordat het in de handel wordt gebracht of in gebruik wordt
    gesteld.

    Dit is wetgeving uit **afdeling B**, en dat verandert de gevolgen. Artikel 2, lid 2,
    bepaalt dat op een AI-systeem dat op grond van artikel 6, lid 1, als systeem met een
    hoog risico wordt aangemerkt en verband houdt met een product dat onder afdeling B valt,
    **uitsluitend artikel 6, lid 1, artikel 60 bis, en de artikelen 102 tot en met 112 van
    toepassing zijn**; de artikelen 57, 58 en 59 zijn alleen van toepassing voor zover de
