--- # not-an-ai-system
id: not-an-ai-system
title:
  en: Not an AI system - other regulation may apply instead
  nl: Geen AI-systeem - andere regelgeving kan gelden
description:
  en: |
    Your system does not meet the definition in Article 3(1), so the AI Act does not
    apply and this walk ends here. **The Act does not say what applies instead.** Article
    2(9) only records that it is without prejudice to other Union law on consumer
    protection and product safety.

    Any other list is editorial: the owner names **product safety regulation** and the
    **product liability directive** as worth checking. Data protection, food and
    machinery law may also be relevant; none is covered by this Tree.
  nl: |
    Uw systeem voldoet niet aan de definitie van artikel 3, punt 1, dus de
    AI-verordening geldt er niet voor en de doorloop eindigt hier. **De verordening zegt
    niet wat in plaats daarvan geldt.** Artikel 2, lid 9, bepaalt alleen dat zij geen
    afbreuk doet aan ander Unierecht inzake consumentenbescherming en productveiligheid.

    Elke andere opsomming is redactioneel: de eigenaar noemt de
    **productveiligheidsregelgeving** en de **richtlijn productaansprakelijkheid**.
metadata:
