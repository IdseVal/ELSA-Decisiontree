    toepassing zijn**; de artikelen 57, 58 en 59 zijn alleen van toepassing voor zover de
    eisen voor systemen met een hoog risico van deze verordening in die wetgeving zijn
    opgenomen.

    Bijlage I beperkt dit onderdeel tot het ontwerp, de productie en het in de handel
    brengen van luchtvaartuigen als bedoeld in artikel 2, lid 1, punten a) en b), van die
    verordening, wat betreft **onbemande luchtvaartuigen** en hun motoren, propellers,
    onderdelen en apparatuur om het luchtvaartuig op afstand te besturen. Drones voor
    gewasinspectie en spuiten zijn het agrifood-geval.

    Dit is alleen uitleg. Ga terug naar de vorige stap om te antwoorden.
