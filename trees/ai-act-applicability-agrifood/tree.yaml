    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727#art_2
terminal:
  outcome: refer

--- # predicting-criminal-offences
id: predicting-criminal-offences
title:
  en: Predicting criminal offences from profiling alone
  nl: Strafbare feiten voorspellen op basis van profilering
description:
  en: |
    Article 5(1)(d) prohibits placing on the market, putting into service for this
    purpose, or using an AI system for **risk assessments of natural persons to assess or
    predict the risk of their committing a criminal offence**, based **solely** on
    profiling or on assessing personality traits. It does **not** apply to systems that
    support a human assessment of involvement in a criminal activity already based on
    objective and verifiable facts directly linked to that activity.
  nl: |
    Artikel 5, lid 1, punt d), verbiedt het in de handel brengen, voor dit doel in gebruik
    stellen of gebruiken van een AI-systeem voor **risicobeoordelingen om te voorspellen
    of iemand een strafbaar feit pleegt**, **uitsluitend** op basis van profilering of
    persoonlijkheidskenmerken. Het geldt **niet** voor systemen die een menselijke
    beoordeling ondersteunen die al berust op objectieve en verifieerbare feiten die
    rechtstreeks met de criminele activiteit verband houden.
metadata:
  version: "0.2"
sources:
