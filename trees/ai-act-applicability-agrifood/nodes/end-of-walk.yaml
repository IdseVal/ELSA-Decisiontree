title:
  en: The AI Act applies to your system - this walk ends here
  nl: De AI-verordening is van toepassing op uw systeem - deze doorloop eindigt hier
description:
  en: |
    You have worked through all six steps. What you have established is this: the AI Act
    reaches you (step 1), your system is an AI system within the meaning of Article 3(1)
    (step 2), it is not a prohibited practice (step 3), and you have answered the high-risk
    (step 4), general-purpose AI (step 5) and transparency (step 6) questions.

    **If step 4 found your system to be high-risk, that finding stands.** The later steps do
    not take it away: Article 50(6) provides that the transparency obligations do not affect
    the requirements and obligations of Chapter III, so a high-risk system that also falls
    under Article 50 carries both sets of duties at once.

    **The Tree stops here for now.** It was built to establish *whether and how* the Act
    applies, not what to do about it. Whichever answer you gave at the transparency step,
    this is where the walk ends in this version.

    What is **not** in this Tree, and where you will have to look further:

    - the **obligations** that follow from what you found: the Chapter III requirements for
      high-risk systems, the duties of providers, deployers, importers and distributors, the
      Chapter V obligations for providers of general-purpose AI models, and what Article 50
      requires you to do in each situation you recognised;
    - **conformity assessment, registration and the CE marking**;
    - **which role you are in.** The Act attaches different duties to providers and to
      deployers, and this Tree has not asked you which one you are. Step 3 and step 6 both
      depend on that answer;
    - **enforcement and penalties**.

    Two things to carry away. First, the answers change with the system: adaptiveness,
    a new intended purpose or a new market can move you to a different branch, so it is worth
    walking this again after a significant change. Second, **this Tree is not legal advice**
    and its content has not been through legal review.
  nl: |
    U hebt alle zes stappen doorlopen. Wat u daarmee hebt vastgesteld: de AI-verordening
    bereikt u (stap 1), uw systeem is een AI-systeem in de zin van artikel 3, punt 1 (stap 2),
    het is geen verboden praktijk (stap 3), en u hebt de vragen over hoog risico (stap 4), AI
    voor algemene doeleinden (stap 5) en transparantie (stap 6) beantwoord.

    **Als stap 4 heeft uitgewezen dat uw systeem een hoog risico heeft, blijft die bevinding
    staan.** De latere stappen nemen die niet weg: artikel 50, lid 6, bepaalt dat de
    transparantieverplichtingen de voorschriften en verplichtingen van hoofdstuk III onverlet
    laten, zodat een systeem met een hoog risico dat ook onder artikel 50 valt beide
    verplichtingenpakketten tegelijk draagt.

    **De boom stopt hier voorlopig.** Hij is gebouwd om vast te stellen *of en hoe* de
    verordening van toepassing is, niet wat u vervolgens moet doen. Welk antwoord u bij de
    transparantiestap ook hebt gegeven, hier eindigt de doorloop in deze versie.

    Wat **niet** in deze boom zit, en waar u verder moet kijken:

    - de **verplichtingen** die volgen uit wat u hebt gevonden: de eisen van hoofdstuk III
      voor systemen met een hoog risico, de plichten van aanbieders, gebruiksverantwoordelijken,
      importeurs en distributeurs, de verplichtingen van hoofdstuk V voor aanbieders van
      AI-modellen voor algemene doeleinden, en wat artikel 50 in elke door u herkende situatie
      van u verlangt;
    - **conformiteitsbeoordeling, registratie en de CE-markering**;
    - **in welke rol u zit.** De verordening verbindt verschillende plichten aan aanbieders en
      aan gebruiksverantwoordelijken, en deze boom heeft u niet gevraagd welke van beide u
      bent. Stap 3 en stap 6 hangen allebei van dat antwoord af;
    - **handhaving en sancties**.

    Twee dingen om mee te nemen. Ten eerste veranderen de antwoorden mee met het systeem:
    aanpassingsvermogen, een nieuw beoogd doel of een nieuwe markt kunnen u in een andere tak
    doen belanden, zodat het de moeite waard is deze doorloop na een belangrijke wijziging
    opnieuw te maken. Ten tweede: **deze boom is geen juridisch advies** en de inhoud ervan
    heeft geen juridische toetsing ondergaan.
