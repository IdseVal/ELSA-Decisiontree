options:
  - title:
      en: Military, defence or national security purposes, and areas outside Union law
      nl: Militaire, defensie- of nationale veiligheidsdoeleinden, en gebieden buiten het Unierecht
    target: exclusion-national-security
  - title:
      en: Third-country authorities and international organisations in law enforcement cooperation
      nl: Autoriteiten van derde landen en internationale organisaties bij samenwerking op het gebied van rechtshandhaving
    target: exclusion-third-country-authorities
  - title:
      en: Developed and put into service for the sole purpose of scientific research and development
      nl: Ontwikkeld en in gebruik gesteld met wetenschappelijk onderzoek en wetenschappelijke ontwikkeling als enig doel
    target: exclusion-scientific-research
  - title:
      en: Research, testing or development before the system is placed on the market
      nl: Onderzoeks-, test- of ontwikkelingsactiviteiten voordat het systeem in de handel wordt gebracht
    target: exclusion-research-and-development
  - title:
      en: Deployers who are natural persons using a system in a purely personal, non-professional activity
      nl: Gebruiksverantwoordelijken die natuurlijke personen zijn en een systeem in een louter persoonlijke niet-beroepsactiviteit gebruiken
    target: exclusion-personal-use
  - title:
      en: Systems released under free and open-source licences (partial exclusion only)
      nl: Systemen die worden vrijgegeven onder vrije en opensourcelicenties (slechts gedeeltelijke uitsluiting)
    target: exclusion-open-source
answers:
  yes: ai-system-definition
  no: ai-act-does-not-apply
