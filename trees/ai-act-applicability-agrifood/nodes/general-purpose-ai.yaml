  placeholder: true
  owner-action: |
    Placeholder for the owner to refine (core document 3.3, items 5 and 7). The research
    shows this step is really two questions with different consequences - "do you provide a
    general-purpose AI model?" (Chapter V obligations) and "is your system based on such a
    model?" (relevant to Article 50(2) and to the downstream-provider definition) - which one
    yes/no cannot separate. Splitting it into two Nodes, or adding a role question, is an
    authoring decision the owner should make after seeing the tool.
