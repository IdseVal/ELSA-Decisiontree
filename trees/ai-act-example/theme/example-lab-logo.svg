<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="Example Lab">
  <!-- A walk that branches: one line in, two lines out. The example Tree's own mark, drawn
       for this repository so that the example carries no real lab's identity. -->
  <g fill="none" stroke="#161a1d" stroke-width="3" stroke-linecap="round">
    <path d="M14 46v-12h32V16"/>
    <path d="M46 34h-1 1v12"/>
  </g>
  <circle cx="46" cy="14" r="6" fill="#e2604a"/>
  <circle cx="14" cy="48" r="4" fill="#5aa9c9"/>
  <circle cx="46" cy="48" r="4" fill="#5aa9c9"/>
  <text x="68" y="30" font-family="sans-serif" font-size="19" font-weight="700" fill="#161a1d">Example Lab</text>
  <text x="68" y="47" font-family="sans-serif" font-size="11" fill="#5c6669">a Tree that is not a real one</text>
</svg>
