# The Carousel's fixture (docs/specs/application.md section 12, issue #43): a root Node with
# five Images, more than one page of the strip holds, so that `previous` and `next` have
# somewhere to go; a Node with two Images, the common case; and a Terminal whose one Image
# no other page may ask for (12.4). The pictures are small drawings of different shapes --
# landscape, wide, portrait, square, panorama -- so the thumbnails and the enlarged view are
# seen cropping and fitting each of them.
format: elsa-tree/2
languages: [en, nl]
root: five
title:
  en: The Carousel fixture
  nl: De carrousel-fixture
metadata:
  version: "1.0"

--- # five
id: five
title:
  en: Does your farm use AI to decide when to harvest?
  nl: Gebruikt uw bedrijf AI om te bepalen wanneer er geoogst wordt?
description:
  en: |
    Five pictures of the places such a system watches. Look through them below, then answer.
  nl: |
    Vijf afbeeldingen van de plekken die zo'n systeem in de gaten houdt. Bekijk ze hieronder en antwoord dan.
metadata:
  version: "1.0"
images:
  - file: orchard.svg
    description:
      en: An orchard of three apple trees under a yellow sun
      nl: Een boomgaard met drie appelbomen onder een gele zon
    credit: "Drawing: Example Studio, CC0 1.0"
  - file: greenhouse.svg
    description:
      en: Two greenhouses with rows of seedlings and a shed beside them
      nl: Twee kassen met rijen zaailingen en een schuur ernaast
    credit: "Drawing: Example Studio, CC BY 4.0"
  - file: drone.svg
    description:
      en: A drone scanning a field from above
      nl: Een drone die een akker van bovenaf scant
    credit: "Drawing: Example Illustrator, via Example Commons, CC BY-SA 4.0"
  - file: tractor.svg
    description:
      en: A red tractor on a dirt track
      nl: Een rode tractor op een zandpad
    credit: "Drawing: Example Studio, CC0 1.0"
  - file: harbour.svg
    description:
      en: A fishing harbour at sunset with a boat leaving the quay
      nl: Een vissershaven bij zonsondergang met een boot die de kade verlaat
    credit: "Drawing: Example Cartography, public domain"
answers:
  yes: two
  no: done

