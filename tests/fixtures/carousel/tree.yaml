--- # long
id: long
title:
  en: Does the system control the water supply?
  nl: Regelt het systeem de watertoevoer?
description:
  en: |
    One credit at the format's limit of 120 characters, which the caption line holds whole at every width the strip is shown at.
  nl: |
    Een vermelding op de grens van 120 tekens, die de onderschrift-regel heel toont op elke breedte waarop de strip staat.
