# One Node at every maximum docs/specs/tree-format.md 5.7 allows (application.md 10.6):
# an 80-character title, a 150-character description of two estimated lines, 3 Sources,
# 8 Options, 10 Images, and one explainer with a 40-character term and a 200-character
# text. Each Option target carries, as its first Image, the picture its Option carried in
# elsa-tree/2 (the migration of #79 moved them). If this fits inside the Bubble at the
# guaranteed viewport, every valid Tree fits. A Trail of 49 entries is made by visiting
# `full` 49 times: adjacency is not checked (application.md 4.3).
format: elsa-tree/3
languages: [en, nl]
root: full
title:
  en: The full Node fixture
  nl: De volle-stap-fixture
metadata:
  version: "1.0"

