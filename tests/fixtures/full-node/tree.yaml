# One Node at every maximum docs/specs/tree-format.md 5.7 allows (application.md 10.6):
# an 80-character title, a 600-character description of eight estimated lines, 3 Sources,
# 8 Options, 10 Images, and every Option a picture of its own, so the Carousel holds the
# 18 of application.md 12.1 (the first Option carries three). Every Option target leads
# with a first Image, the picture its button and its Overlay show (10.3, 10.9). If this
# fits inside the Bubble at the guaranteed viewport, every valid Tree fits. A Trail of 49
# entries is made by visiting `full` 49 times: adjacency is not checked (application.md 4.3).
format: elsa-tree/2
languages: [en, nl]
root: full
title:
