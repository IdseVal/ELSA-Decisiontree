# The Overlay at its largest (application.md 10.6, 10.9): `big` is an explanation Node at
# every maximum docs/specs/tree-format.md 5.7 allows -- an 80-character title, a
# 600-character description of eight estimated lines, 3 Sources, 10 Images, 8 Options of
# its own, each with a 60-character title and a target that leads with an Image -- and it
# is the first Option of `five`, a question Node with five Options, so the fan of three
# and two is measured too. `/overlay/five/big` renders `five` with `big`'s Overlay open;
# `/overlay/five/big/o1` the same page with the deeper Overlay open (10.9).
