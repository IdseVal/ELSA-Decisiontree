# The findability fixture (docs/specs/application.md section 7): a two-language Tree built
# to be awkward for the documents of section 16 rather than to read well.
#
# - the manifest carries NO `description`, so the Dataset of 16.4 and `llms.txt` of 16.5
#   fall back to the root Node's (#121, #122);
# - the Tree's title and one Node's title carry `&`, `<`, `>`, `"` and a literal
#   `</script>`, so the XML escaping of 16.2 and the JSON escaping of 16.4 are exercised
#   rather than assumed;
# - `start` holds two `kind: legal` Sources at one URL and a third at another, so
#   `isBasedOn`'s most-frequent rule has something to choose (#122);
# - `no-sources` holds none at all;
# - there is a Terminal and an explanation Node, so the "no `Question`" half of 16.4 has a
#   subject.
#
# What section 7 also asks of this fixture and it cannot hold: a description over 155
# counted characters, for the cut of 16.3 step 4. A Node description is at most 150
# counted characters (tree-format.md 5.7, V-LENGTH) and this Tree's manifest has none by
# the line above, so no conforming Tree can carry one -- which is 16.3's own sentence that
# steps 3 and 4 do not fire for a conforming Tree. The cut is tested on a string instead,
# in tests/markdown.test.ts.
format: elsa-tree/3
languages: [en, nl]
root: start
title:
  en: 'Findability & escaping: <b>, "quotes" & </script>'
  nl: 'Vindbaarheid & escaping: <b>, "aanhalingstekens" & </script>'
metadata:
  version: "1.0"

--- # start
id: start
title:
  en: Does the Act apply to your system?
  nl: Is de verordening van toepassing op uw systeem?
description:
  en: |
    The first question, and the one the [Dataset](#dataset) record describes the Tree by when the manifest says nothing.
  nl: |
    De eerste vraag, en degene die het [datasetrecord](#dataset) gebruikt als het manifest niets zegt.
metadata:
  version: "1.0"
sources:
  - id: art-2
    kind: legal
    label:
      en: Article 2 of the AI Act
      nl: Artikel 2 AI-verordening
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - id: art-3
    kind: legal
    label:
      en: Article 3 of the AI Act
      nl: Artikel 3 AI-verordening
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - id: gdpr
    kind: legal
    label:
      en: The General Data Protection Regulation
      nl: De Algemene verordening gegevensbescherming
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
explainers:
  - id: dataset
    term:
      en: Dataset
      nl: datasetrecord
    text:
      en: 'The record a dataset index reads: what this Tree is and where to download it.'
      nl: 'Het record dat een datasetindex leest: wat deze Boom is en waar hij te vinden is.'
options:
  - title:
      en: What does "<placing on the market>" mean?
      nl: Wat betekent "<in de handel brengen>"?
    target: placing-on-the-market
answers:
  yes: applies
  no: no-sources

--- # placing-on-the-market
id: placing-on-the-market
title:
  en: '"Placing on the market" & <what it means> </script>'
  nl: '"In de handel brengen" & <wat het betekent> </script>'
description:
  en: |
    An explanation Node, so 16.4 emits no Question for it. Its title is the awkward one.
  nl: |
    Een toelichting, dus 16.4 zendt hier geen Question uit. De titel is de lastige.
metadata:
  version: "1.0"

--- # no-sources
id: no-sources
title:
  en: A question with no Source at all
  nl: Een vraag zonder enige bron
description:
  en: |
    No Source, so nothing here can contribute to the most frequent legal URL of 16.4.
  nl: |
    Geen bron, dus niets hier telt mee voor de meest voorkomende juridische URL van 16.4.
metadata:
  version: "1.0"
answers:
  yes: applies
  no: does-not-apply

--- # applies
id: applies
title:
  en: The Act applies
  nl: De verordening is van toepassing
description:
  en: |
    The walk ends here.
  nl: |
    De doorloop eindigt hier.
metadata:
  version: "1.0"
terminal:
  outcome: applicable

--- # does-not-apply
id: does-not-apply
title:
  en: The Act does not apply
  nl: De verordening is niet van toepassing
description:
  en: |
    The walk ends here.
  nl: |
    De doorloop eindigt hier.
metadata:
  version: "1.0"
terminal:
  outcome: not-applicable
