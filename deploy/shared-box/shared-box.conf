# systemd drop-in for the shared box (docs/hosting-shared-box.md). Installed as
# /etc/systemd/system/elsa-decisiontree.service.d/shared-box.conf, beside the unit from
# deploy/elsa-decisiontree.service, which stays as it is: this file only changes what differs
# on that box.
#
# - The server runs from /srv/elsa/current, the standalone folder deploy.sh puts there,
#   not from /opt/elsa-decisiontree/app.
# - Node.js is found on the unit's PATH (/usr/bin/node from the distribution's or NodeSource's
#   package). If the box's Node is older than 22.18 (package.json "engines") and the other
#   project needs it that way, install Node 22 for this service alone under /srv/elsa/node and
#   put its bin/ first on the PATH line below.
# - The port is 3001, so that nothing collides with the other project; PORT in
#   /etc/elsa-decisiontree.env says the same.

[Service]
WorkingDirectory=/srv/elsa/current
ExecStart=
ExecStart=/usr/bin/env node server.js
Environment=PATH=/srv/elsa/node/bin:/usr/local/bin:/usr/bin:/bin
